<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta http-equiv="Cache-Control" content="no-cache, must-revalidate"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心臟血管外科自費整合同意書產生器 ver17</title>
<style>
  :root{--blue:#1d5fa8;--blue-d:#15457a;--line:#c9d4e0;--bg:#f3f6fa;--ink:#1b2733;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans CJK TC",sans-serif;color:#1b2733;background:#f3f6fa;}
  .app{display:flex;min-height:100vh;}
  .panel{width:50%;max-width:720px;overflow-y:auto;height:100vh;border-right:1px solid #c9d4e0;background:#fff;}
  .phead{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:2px solid #1d5fa8;position:sticky;top:0;background:#fff;z-index:5;}
  .phead img{height:46px;}
  .phead h1{font-size:16px;margin:0;color:#15457a;line-height:1.3;}
  .phead .t2{font-size:12px;color:#6b7886;}
  .pbody{padding:16px 20px;}
  fieldset{border:1px solid #c9d4e0;border-radius:8px;margin:0 0 14px;padding:12px 14px;}
  legend{font-size:13px;font-weight:700;color:#1d5fa8;padding:0 6px;}
  legend .pick{font-weight:400;color:#6b7886;font-size:12px;}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 12px;}
  .fld{display:flex;flex-direction:column;font-size:12px;gap:3px;}
  .fld.w2{grid-column:span 2;}.fld.w3{grid-column:span 3;}
  .fld label{color:#52616f;}
  .fld input,.fld select{padding:6px 8px;border:1px solid #c9d4e0;border-radius:6px;font-size:13px;font-family:inherit;}
  .reasons{display:flex;flex-direction:column;gap:5px;font-size:12.5px;margin-top:4px;}
  .reasons label{display:flex;gap:7px;align-items:flex-start;cursor:pointer;line-height:1.5;}
  .reasons input{margin-top:3px;flex:none;}
  .reasons .rs{color:#52616f;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{padding:6px 11px;border:1px solid #c9d4e0;background:#fff;border-radius:18px;font-size:12px;cursor:pointer;white-space:nowrap;}
  .chip:hover{border-color:#1d5fa8;}
  .chip.active{background:#1d5fa8;color:#fff;border-color:#1d5fa8;}
  .chip .n{opacity:.7;font-size:11px;}
  .hint{color:#9aa7b4;font-size:12.5px;padding:4px 2px;}
  .pkgbox .chip-pkg{background:#eef8f0;border-color:#7bb88a;color:#1f5f30;font-weight:600;}
  .pkgbox .chip-pkg:hover{background:#dff1e4;}
  .pkgbox .chip-pkg .pkg-x{margin-left:7px;color:#a32424;font-weight:700;padding:0 2px;}
  .pkgbox .chip-pkg.on{background:#1f7a3a;border-color:#1f7a3a;color:#fff;}
  .pkgbox .chip-pkg.on .n{color:#e6f4ea;opacity:1;}
  .pkgbox .chip-pkg.on .pkg-x{color:#ffd6d6;}
  .pkgbox .chip-pkg.del{background:#fde2e2;border-color:#d77;color:#a32424;}
  .pkgbox .pkg-save{margin-top:8px;}
  .pkgbox .pkg-tools{font-size:12px;margin-top:6px;color:#1d5fa8;}
  .pkgbox .pkg-tools a,.pkgbox .pkg-tools label{cursor:pointer;text-decoration:underline;margin-right:14px;}
  .pkgbox .pkg-msg{font-size:12.5px;color:#1f5f30;margin-top:6px;min-height:1em;}
  .pkgbox .pkg-msg.warn{color:#a32424;}
  .addbox{border:1px dashed #d8a; background:#fffdf6; border-radius:8px; padding:10px 12px; margin:10px 0;}
  .addttl{font-size:12.5px;font-weight:700;color:#8a5a12;margin-bottom:6px;}
  .addrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .addrow input{padding:7px 9px;border:1px solid #c9d4e0;border-radius:6px;font-size:13px;flex:1;min-width:90px;font-family:inherit;}
  .toolbar{display:flex;gap:8px;margin:2px 0 10px;}
  .toolbar input{flex:1;padding:8px 10px;border:1px solid #c9d4e0;border-radius:6px;font-size:13px;font-family:inherit;}
  .grouphd{font-size:12.5px;font-weight:700;color:#15457a;margin:12px 0 6px;padding-bottom:3px;border-bottom:1px dashed #c9d4e0;display:flex;justify-content:space-between;}
  .grouphd .gc{font-weight:400;color:#9aa7b4;font-size:11px;}
  .item{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border:1px solid #c9d4e0;border-radius:8px;margin-bottom:6px;cursor:pointer;}
  .item:hover{border-color:#1d5fa8;background:#f7faff;}
  .item.sel{border-color:#1d5fa8;background:#eaf2fc;}
  .item input[type=checkbox]{margin-top:3px;width:17px;height:17px;flex:none;}
  .item .meta{flex:1;min-width:0;}
  .item .nm{font-size:13px;font-weight:600;line-height:1.35;}
  .item .tags{font-size:11px;color:#6b7886;margin-top:2px;}
  .badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10.5px;margin-right:5px;}
  .b-drug{background:#e8e3f7;color:#4b3a8a;}.b-mat{background:#fde2e2;color:#a32424;}.b-bundle{background:#e2f1e6;color:#1f5f30;}.b-warn{background:#fff2d6;color:#9a6a00;}
  .price{font-weight:700;color:#15457a;white-space:nowrap;font-size:13px;text-align:right;}
  .price .u{font-weight:400;color:#6b7886;font-size:11px;}
  .qtybox{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:12px;flex-wrap:wrap;}
  .qtybox input{width:58px;padding:4px 6px;border:1px solid #c9d4e0;border-radius:5px;font-size:13px;font-family:inherit;}
  .qtybox input.pr{width:84px;}
  .selbar{background:#f7faff;border:1px solid #c9d4e0;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12px;}
  .selbar .h{font-weight:700;color:#15457a;margin-bottom:4px;}
  .selrow{display:flex;justify-content:space-between;gap:8px;padding:2px 0;align-items:center;}
  .selrow .q{width:46px;padding:2px 4px;border:1px solid #c9d4e0;border-radius:4px;font-size:12px;margin:0 2px;font-family:inherit;}
  .selrow a{color:#a32424;cursor:pointer;text-decoration:none;font-size:11px;}
  .actions{position:sticky;bottom:0;background:#fff;padding:12px 20px;border-top:1px solid #c9d4e0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .sum{font-size:13px;}.sum b{color:#15457a;font-size:16px;}
  .btn{padding:9px 16px;border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-pri{background:#1d5fa8;color:#fff;}.btn-pri:hover{background:#15457a;}
  .btn-ghost{background:#eef2f7;color:#1b2733;}
  .empty{color:#9aa7b4;font-size:13px;text-align:center;padding:18px;}
  .todo{font-size:12px;color:#6b4a00;background:#fff8e6;border:1px solid #f0d890;border-radius:8px;padding:8px 10px;}
  .todo summary{cursor:pointer;font-weight:700;}
  .todo li{margin:3px 0;}
  .preview{flex:1;height:100vh;overflow-y:auto;padding:24px;display:flex;justify-content:center;background:#f3f6fa;}
  .paper{background:#fff;width:794px;max-width:100%;padding:28px 38px;box-shadow:0 2px 14px rgba(0,0,0,.1);font-size:15.5px;line-height:1.7;height:fit-content;position:relative;}
  .sheet{width:100%;border-collapse:collapse;}
  .sheet>thead>tr>td,.sheet>tfoot>tr>td,.sheet>tbody>tr>td{border:0;padding:0;}
  .phd{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;margin:0 0 4px;padding-bottom:2px;}
  .phd-mid{flex:1;display:flex;flex-direction:column;align-items:center;}
  .phd-mid img{max-width:180px;width:100%;height:auto;margin:0 0 2px;}
  .phd-mid h2{margin:2px 0 0;text-align:center;font-size:24px;letter-spacing:.5em;text-indent:.5em;}
  .sticker{width:40mm;height:20mm;border:1px solid #333;box-sizing:border-box;overflow:hidden;flex:none;}
  .stk-r{font-size:9px;line-height:1;padding:1px 3px;border-bottom:1px solid #ccc;height:4.6mm;overflow:hidden;white-space:nowrap;}
  .stk-r:last-child{border-bottom:none;}
  .hcampus{font-size:14px;text-align:left;white-space:nowrap;line-height:1.9;flex:none;width:40mm;padding-left:14mm;}
  .intro{font-size:14px;text-align:justify;margin:2px 0 2px;line-height:1.55;}
  .intro u{text-decoration:none;border-bottom:1px solid #333;padding:0 4px;}
  .clauses{font-size:13px;text-align:justify;margin:0 0 4px;}
  .clauses .cl{display:flex;gap:4px;margin:1px 0;line-height:1.5;}
  .clauses .cn{flex:none;width:2.2em;}
  .clauses .cb{flex:none;width:1.2em;}
  .clauses .ct{flex:1;}
  .clauses .sub{color:#333;}
  .mat-ttl{font-size:15px;margin:4px 0 2px;font-weight:600;}
  .itbl{width:100%;border-collapse:collapse;margin:4px 0;table-layout:fixed;}
  .itbl th,.itbl td{border:1px solid #444;padding:3px 4px;font-size:12.5px;text-align:center;vertical-align:middle;overflow-wrap:break-word;word-break:break-all;line-height:1.4;}
  .itbl th{background:#eef0f2;font-weight:600;}
  .itbl td.l{text-align:left;word-break:break-word;}.itbl td.r{text-align:right;}
  .itbl td .sm{font-size:10.5px;color:#555;display:block;}
  .itbl tr.ttl td{font-weight:700;background:#f7f7f7;}
  .itbl tr.blank td{height:26px;}
  .ben{margin:6px 0 2px;}
  .ben .ben-h{font-weight:700;font-size:14.5px;color:#15457a;margin:4px 0 2px;}
  .ben .bt{font-weight:700;font-size:13.5px;color:#15457a;border-left:4px solid #1d5fa8;padding-left:6px;margin:6px 0 2px;}
  .ben .bx{font-size:12.5px;text-align:justify;color:#333;border:1px solid #ddd;border-radius:4px;padding:4px 7px;line-height:1.5;page-break-inside:avoid;}
  .legal{font-size:12px;color:#333;margin:4px 0 2px;text-align:justify;line-height:1.4;}
  .oath{font-size:14px;margin:1px 0;}
  .to{font-size:14.5px;margin:0;line-height:1.5;}
  .sign{margin-top:4px;font-size:14.5px;line-height:2.2;}
  .sign u{text-decoration:none;border-bottom:1px solid #333;display:inline-block;min-width:11em;padding:0 4px;}
  .sign u.s{min-width:5em;}
  .sign .sgap{height:3.6em;}
  .pv-empty{color:#9aa7b4;text-align:center;align-self:center;font-size:15px;}
  .footer{margin-top:10px;padding-top:5px;border-top:1px solid #888;font-size:9px;color:#555;}
  .ftbl{width:100%;border-collapse:collapse;}
  .ftbl td.fcol{width:50%;vertical-align:top;text-align:left;padding:0 10px;font-size:9px;line-height:1.5;}
  .ck{display:inline-block;width:1em;text-align:center;font-family:"MingLiU","PMingLiU","Microsoft JhengHei",sans-serif;}
  @media print{
    body{background:#fff;} .panel{display:none;} .app{display:block;}
    .preview{height:auto;overflow:visible;padding:0;display:block;background:#fff;}
    .paper{box-shadow:none;width:100%;padding:10mm 14mm 25mm;} /* 以內距取代頁邊，@page 邊界設 0 可去掉瀏覽器自動印的網址與日期；底部留白給置底頁尾 */
    .footer{position:fixed;bottom:12mm;left:14mm;right:14mm;margin:0;background:#fff;} /* 每頁置底（列印時 fixed 元素會在每一頁重複） */
    .sheet tfoot .footer{page-break-inside:avoid;}
    .paper{font-size:14.5px;}
    .itbl tr{page-break-inside:avoid;}
    .sign{page-break-inside:avoid;}
    @page{size:A4;margin:0;}
    .mtabs{display:none !important;} body.m-fill .preview{display:block !important;}
    .pv-wrap{display:block;height:auto !important;} .paper{transform:none !important;}
  }
  /* ===== 手機／平板直向：上下堆疊 + 填寫／預覽切換（≤900px，僅螢幕） ===== */
  .mtabs{display:none;}
  .pv-wrap{display:contents;}
  @media screen and (max-width:900px){
    .app{flex-direction:column;min-height:100vh;}
    .mtabs{display:flex;position:sticky;top:0;z-index:7;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.06);}
    .mtabs button{flex:1;padding:13px 8px;border:0;background:#fff;font-size:15px;font-weight:700;color:#6b7886;border-bottom:3px solid transparent;font-family:inherit;cursor:pointer;}
    .mtabs button.on{color:var(--blue);border-bottom-color:var(--blue);}
    .panel{width:100%;max-width:none;height:auto;border-right:0;overflow:visible;}
    .phead{position:static;padding:10px 14px;}
    .phead img{height:36px;}
    .phead h1{font-size:15px;}
    .pbody{padding:12px 12px 96px;}
    .preview{height:auto;overflow:visible;display:block;padding:10px 8px 96px;}
    .pv-wrap{display:block;width:100%;overflow:hidden;}
    .paper{width:794px;max-width:none;transform-origin:top left;margin:0;}
    .pv-empty{display:block;padding:40px 12px;}
    body.m-fill .preview{display:none;}
    body.m-preview .pbody,body.m-preview .phead{display:none;}
    .actions{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 8px rgba(0,0,0,.08);}
    .actions .sum{flex:1 1 100%;text-align:center;}
    .actions .btn{flex:1;padding:12px 8px;font-size:15px;}
    .actions .btn-word{display:none;}
    .grid{grid-template-columns:1fr 1fr;}
    .fld.w3{grid-column:span 2;}
    .fld input,.fld select,.addrow input,.toolbar input,.qtybox input,.selrow .q{font-size:16px;}
    .fld input,.fld select{padding:10px 10px;}
    .chip{padding:10px 14px;font-size:14px;}
    .item{padding:12px 12px;}
    .item input[type=checkbox]{width:22px;height:22px;}
    .item .nm{font-size:15px;}
    .reasons{font-size:14px;}
    .reasons input{width:20px;height:20px;}
    .planbar{font-size:13px;}
  }
  @media screen and (max-width:600px){
    .grid{grid-template-columns:1fr;}
    .fld.w2,.fld.w3{grid-column:span 1;}
  }
</style>
<style id="outStyle">
  /* 同意書（預覽／列印／Word）：中文標楷體、英數 Times New Roman；左側操作面板維持正黑體 */
  .paper,.paper *{font-family:"Times New Roman","DFKai-SB","BiauKai","Kaiti TC","STKaiti","標楷體","TW-Kai","AR PL UKai TW",serif;}
  .paper .ck{font-family:"MingLiU","PMingLiU","DFKai-SB","標楷體",sans-serif;}
  .stk-r,.ftbl td.fcol{font-size:9px;}
</style>
</head>
<body>
<div class="app">
  <div class="mtabs" id="mtabs">
    <button type="button" class="on" id="mtabFill" onclick="setMode('fill')">填寫</button>
    <button type="button" id="mtabPreview" onclick="setMode('preview')">預覽同意書</button>
  </div>
  <div class="panel">
    <div class="phead">
      <img id="headLogo" alt="">
      <div><h1 id="appTitle"></h1><div class="t2" id="appSub"></div></div>
    </div>
    <div class="pbody">
      <fieldset>
        <legend>① 同意書設定 <span class="pick">（病人姓名／病歷號／身分證／生日改用貼紙黏貼）</span></legend>
        <div class="grid">
          <div class="fld"><label>院區</label><select id="p_campus"></select></div>
          <div class="fld"><label>告知醫師</label><select id="p_docsel" onchange="docSel()"></select><input id="p_doc" value="" placeholder="請輸入醫師姓名" style="display:none;margin-top:4px"></div>
          <div class="fld"><label>床號（選填）</label><input id="p_bed" placeholder=""></div>
          <div class="fld w2"><label>生效日期（自＿年＿月＿日起；預設今天，清空則印空白）</label><input id="p_date" type="date"></div>
          <div class="fld"><label>表格預留空白列</label><select id="p_blank"></select></div>
          <div class="fld w3"><label>自費原因（勾選者印 ■，其餘印 □；條文照院方表單全部列印）</label>
            <div class="reasons" id="reasonBox"></div>
          </div>
        </div>
      </fieldset>

      <fieldset class="pkgbox">
        <legend>② 手術組套 <span class="pick">一鍵帶入常用自費品項，帶入後仍可增減</span></legend>
        <div id="presetWrap"></div>
      </fieldset>

      <fieldset>
        <legend>③ 選擇品項 <span class="pick" id="itemPick"></span></legend>
        <div class="toolbar"><input type="text" id="search" placeholder="🔍 搜尋品名／代碼／英文名…" oninput="filterList()"></div>
        <div class="chips" id="catChips"></div>
        <div id="list"></div>
        <div class="addbox"><div class="addttl">找不到品項？手動新增（會直接列入同意書）</div>
          <div class="addrow"><input id="c_name" placeholder="品名（必填）"><input id="c_code" placeholder="收費代碼" style="max-width:110px"><input id="c_price" type="number" min="0" placeholder="單價" style="max-width:100px"><input id="c_unit" placeholder="單位" style="max-width:70px"><input id="c_qty" type="number" min="1" value="1" style="max-width:64px" title="數量"><button class="btn btn-pri" style="padding:7px 12px;font-size:13px" onclick="addCustom()">加入</button></div>
        </div>
      </fieldset>

      <div id="selSummary"></div>

      <details class="todo" style="margin-top:12px" id="todoBox"><summary>⚠ 資料待確認（不會列印）</summary><ul id="todoList"></ul></details>
    </div>
    <div class="actions">
      <div class="sum">已選 <b id="cnt">0</b> 項　合計 NT$ <b id="total">0</b></div>
      <button class="btn btn-ghost" onclick="clearAll()">清除全部</button>
      <button class="btn btn-ghost btn-word" onclick="renderForm();exportWord()">產出 Word 檔</button>
      <button class="btn btn-pri" onclick="renderForm();setTimeout(function(){window.print();},50)">列印同意書</button>
    </div>
  </div>
  <div class="preview"><div class="pv-wrap" id="pvWrap"><div id="paper" class="paper"><div class="pv-empty">← 填好設定、選組套或勾品項，這裡會即時產生同意書</div></div></div></div>
</div>
<script>
/* ===== 相容舊瀏覽器 ===== */
if(!Array.prototype.find){Array.prototype.find=function(f){for(var i=0;i<this.length;i++){if(f(this[i],i,this))return this[i];}return undefined;};}
if(!Array.prototype.some){Array.prototype.some=function(f){for(var i=0;i<this.length;i++){if(f(this[i],i,this))return true;}return false;};}
if(!String.prototype.padStart){String.prototype.padStart=function(t,p){var s=String(this);p=p===undefined?' ':String(p);while(s.length<t){s=p+s;}return s;};}

function filterList(){

    if(curCat&&i.cat!==curCat&&!(curCat===''))return false;

  });
  document.getElementById("itemPick").textContent="："+pool.length+" 項";
  var el=document.getElementById("list");
  if(!pool.length){el.innerHTML='<div class="empty">查無符合品項</div>';return;}
  var h="",cur=null;
  pool.forEach(function(i){
    if(i.cat!==cur){cur=i.cat;h+='<div class="grouphd"><span>'+cur+'</span></div>';}
    var k=key(i),s=selected[k];
    var badge=i.kind==="藥品"?'<span class="badge b-drug">藥品</span>':i.kind==="組合"?'<span class="badge b-bundle">組合</span>':'<span class="badge b-mat">特材</span>';

      '<div class="meta"><div class="nm">'+escHtml(i.name)+'</div><div class="tags">'+badge+'代碼 '+escHtml(i.code)+(i.spec?'｜'+escHtml(i.spec):'')+(i.note?'｜'+escHtml(i.note):'')+(i.var?'｜視病人使用情況而定':'')+'</div>'+

var PKEY=CONFIG.storageKey,pkgDel=null,pkgApplied={};
function loadLocalPresets(){try{var x=JSON.parse(localStorage.getItem(PKEY)||"[]");return x&&x.length!==undefined?x:[];}catch(e){return [];}}
function saveLocalPresets(a){try{localStorage.setItem(PKEY,JSON.stringify(a));return true;}catch(e){return false;}}
function allPresets(){
  var loc=loadLocalPresets(),out=[];
  PRESETS.forEach(function(p){var over=loc.filter(function(q){return q.name===p.name;}).length;if(!over){var c={};for(var k in p)c[k]=p[k];c._builtin=1;out.push(c);}});
  return out.concat(loc);
}
function pkgMsg(t,warn){var m=document.getElementById("pkgMsg");if(m){m.className="pkg-msg"+(warn?" warn":"");m.innerHTML=t;}}
function renderPresets(){
  var box=document.getElementById("presetWrap"),_pk=document.getElementById("pk_name"),_pkv=_pk?_pk.value:"";
  var list=allPresets(),h='<div class="chips">';
  list.forEach(function(p){
    var tip=p.items.map(function(i){return i.name+" ×"+i.qty;}).join("\n"),del=pkgDel===p.id,on=!del&&pkgIsOn(p.id);
    h+='<div class="chip chip-pkg'+(del?' del':'')+(on?' on':'')+'" data-id="'+escHtml(p.id)+'" title="'+escHtml((on?'已套用，再按一次取消\n':'')+tip)+'" onclick="applyPreset(\''+esc(p.id)+'\')">'+(del?'再按一次 × 刪除「'+escHtml(p.name)+'」':(on?'✓ ':'📦 ')+escHtml(p.name)+' <span class="n">'+p.items.length+' 項</span>')+(p._builtin?'':'<span class="pkg-x" title="刪除此組套" onclick="event.stopPropagation();delPreset(\''+esc(p.id)+'\')">×</span>')+'</div>';
  });
  h+='</div>';
  h+='<div class="addrow pkg-save"><input id="pk_name" placeholder="組套名稱（同名即覆蓋內建組套），例：瓣膜置換、CABG"><button class="btn btn-ghost" style="padding:7px 12px;font-size:13px" onclick="savePreset()">把目前已選品項存成組套</button></div>';
  h+='<div class="pkg-tools"><a onclick="exportPresets()">匯出全部組套（心外組套.json）</a><label>匯入組套檔<input type="file" accept=".json,application/json" style="display:none" onchange="importPresets(this)"></label></div><div id="pkgMsg" class="pkg-msg"></div>';
  box.innerHTML=h;
  if(_pkv&&document.getElementById("pk_name"))document.getElementById("pk_name").value=_pkv;
}
function matchItem(it){return findByKey(it.code+"|"+it.name)||ITEMS.find(function(i){return i.name===it.name;})||ITEMS.find(function(i){return it.code&&it.code!=="—"&&i.code===it.code;})||null;}
function applyPreset(id){
  if(pkgDel&&pkgDel===id){reallyDel(id);return;}
  if(pkgDel){pkgDel=null;renderPresets();return;}
  if(pkgIsOn(id)){unapplyPreset(id);return;}
  var p=allPresets().filter(function(x){return x.id===id;})[0];if(!p)return;
  var miss=[],n=0,ks=[];
  p.items.forEach(function(it){
    var m=matchItem(it);
    if(!m&&it.custom){m={code:it.code||"—",cat:"其他",name:it.name,spec:"",lic:"",price:it.price||0,unit:it.unit||"",kind:"特材",var:0,custom:1};CUSTOM.push(m);}
    if(!m){miss.push(it.name);return;}
    selected[key(m)]={qty:Math.max(1,parseInt(it.qty)||1),price:(it.price!=null?it.price:m.price)};n++;ks.push(key(m));
  });
  pkgApplied[p.id]=ks;refresh();renderPresets();
  pkgMsg("已帶入組套「"+escHtml(p.name)+"」"+n+" 項（可再加選或修改數量）。"+(miss.length?"<br>⚠ 本版找不到："+miss.map(escHtml).join("、")+"，請改選或手動新增，並重新存組套。":""),miss.length>0);
}
function pkgIsOn(id){var ks=pkgApplied[id];if(!ks)return false;if(ks.some(function(k){return !!selected[k];}))return true;delete pkgApplied[id];return false;}
function unapplyPreset(id){
  var p=allPresets().filter(function(x){return x.id===id;})[0],ks=pkgApplied[id]||[],n=0;delete pkgApplied[id];
  var keep={};for(var o in pkgApplied)if(pkgIsOn(o))pkgApplied[o].forEach(function(k){keep[k]=1;});
  ks.forEach(function(k){if(selected[k]&&!keep[k]){delete selected[k];n++;}});
  refresh();renderPresets();pkgMsg("已取消組套「"+escHtml(p?p.name:"")+"」，移除 "+n+" 項。");
}
function savePreset(){
  var nm=(document.getElementById("pk_name").value||"").trim();if(!nm){pkgMsg("請先輸入組套名稱。",true);return;}
  var sel=selItems();if(!sel.length){pkgMsg("請先勾選要放進組套的品項。",true);return;}
  var items=sel.map(function(i){return {code:String(i.code||""),name:i.name,qty:i.qty,price:i.uprice,unit:i.unit||"",custom:i.custom?1:0};});
  var loc=loadLocalPresets(),ex=loc.filter(function(p){return p.name===nm;})[0],d=new Date(),today=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  if(ex){ex.items=items;ex.updated=today;}else loc.push({id:"p"+d.getTime(),name:nm,items:items,updated:today});
  var ok=saveLocalPresets(loc);renderPresets();
  pkgMsg(ok?(ex?"已更新":"已儲存")+"「"+escHtml(nm)+"」組套（"+items.length+" 項），存在這台電腦的瀏覽器。要讓其他電腦也有，請「匯出全部組套」交回內建到下一版。":"這個瀏覽器無法儲存組套，請改用「匯出全部組套」保存。",!ok);
}
function delPreset(id){if(pkgDel!==id){pkgDel=id;renderPresets();pkgMsg("再按一次紅色的組套（或 ×）即刪除；按其他組套取消。",true);return;}reallyDel(id);}
function reallyDel(id){saveLocalPresets(loadLocalPresets().filter(function(p){return p.id!==id;}));pkgDel=null;renderPresets();pkgMsg("已刪除組套。");}
function refreshPkgChips(){var cs=document.querySelectorAll(".chip-pkg[data-id]");for(var i=0;i<cs.length;i++){var id=cs[i].getAttribute("data-id");if(pkgDel===id)continue;var was=cs[i].className.indexOf(" on")>=0,on=pkgIsOn(id);if(was!==on){renderPresets();return;}}}
var _rs=renderSummary;renderSummary=function(){_rs();refreshPkgChips();};
function exportPresets(){
  var all=allPresets().map(function(p){var c={};for(var k in p)if(k!=="_builtin")c[k]=p[k];return c;});
  var blob=new Blob([JSON.stringify(all,null,1)],{type:"application/json"}),fn=CONFIG.presetFile;
  if(navigator.msSaveOrOpenBlob){navigator.msSaveOrOpenBlob(blob,fn);return;}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);},100);
  pkgMsg("已匯出 "+all.length+" 個組套。");
}
function importPresets(inp){
  var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var arr=JSON.parse(r.result),loc=loadLocalPresets(),n=0;arr.forEach(function(p){if(!p||!p.name||!p.items)return;loc=loc.filter(function(q){return q.name!==p.name;});loc.push({id:p.id||("p"+new Date().getTime()+n),name:p.name,items:p.items,updated:p.updated||""});n++;});saveLocalPresets(loc);renderPresets();pkgMsg("已匯入 "+n+" 個組套。");}catch(e){pkgMsg("檔案格式不正確，無法匯入。",true);}};
  r.readAsText(f,"utf-8");inp.value="";
}

/* ===== Word 匯出 ===== */
function exportWord(){
  var paper=document.getElementById('paper');
  if(!paper||!paper.querySelector('.sheet')){alert('請先勾選品項再產出 Word');return;}
  var css='';var st=document.getElementsByTagName('style');for(var i=0;i<st.length;i++){css+=st[i].innerHTML;}
  var head='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>'+css+'@page{size:A4;margin:12mm;}body{background:#fff;}</style></head><body>';
  var html=head+'<div class="paper">'+paper.innerHTML+'</div></body></html>';
  var blob=new Blob(['\ufeff'+html],{type:'application/msword'}),fn=CONFIG.wordFile;
  if(navigator.msSaveOrOpenBlob){navigator.msSaveOrOpenBlob(blob,fn);}
  else{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);},100);}
}

function docSel(){var sel=document.getElementById("p_docsel"),inp=document.getElementById("p_doc");if(sel.value==="__other"){inp.style.display="";inp.value="";inp.focus();}else{inp.style.display="none";inp.value=sel.value;}renderForm();}
/* ===== 啟動：套用 CONFIG ===== */
(function(){
  document.getElementById("appTitle").textContent=CONFIG.title;
  document.getElementById("appSub").textContent=CONFIG.subtitle;
  var cs=document.getElementById("p_campus");cs.innerHTML=CONFIG.campuses.map(function(c){return '<option>'+escHtml(c)+'</option>';}).join('')+'<option value=""></option>';

  document.getElementById("p_doc").value=CONFIG.doctors[0]||"";

  (CONFIG.defaultReasons||[]).forEach(function(n){REASONS.forEach(function(r){if(r.n===n)r.on=true;});});
  var tl=document.getElementById("todoList");tl.innerHTML=(TODO||[]).map(function(x){return '<li>'+escHtml(x)+'</li>';}).join('');
  if(!(TODO||[]).length)document.getElementById("todoBox").style.display="none";
})();
(function(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};document.getElementById("p_date").value=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());})();
document.getElementById("headLogo").src=LOGO;
["p_campus","p_doc","p_bed","p_date","p_blank"].forEach(function(id){var el=document.getElementById(id);el.addEventListener("input",renderForm);el.addEventListener("change",renderForm);});
renderReasons();renderCats();renderPresets();filterList();renderSummary();renderForm();

/* ===== 手機／平板：填寫／預覽切換 + A4 預覽等比縮放 ===== */
function setMode(m){
  var pv=(m==='preview');
  document.body.className=document.body.className.replace(/\bm-preview\b|\bm-fill\b/g,'').trim()+(pv?' m-preview':' m-fill');
  document.getElementById('mtabFill').className=pv?'':'on';
  document.getElementById('mtabPreview').className=pv?'on':'';
  window.scrollTo(0,0);fitPaper();
}
function fitPaper(){ /* 預覽區不足 794px 寬時等比縮放 A4 預覽；列印不受影響 */
  var paper=document.getElementById('paper'),wrap=document.getElementById('pvWrap'),pv=wrap&&wrap.parentNode;
  if(!paper||!wrap)return;
  var cs=window.getComputedStyle(pv),pad=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0),avail=Math.max(0,pv.clientWidth-pad);
  if(avail>=794){paper.style.transform='';wrap.style.height='';wrap.style.display='';wrap.style.width='';return;}
  var sc=avail/794;wrap.style.display='block';wrap.style.width='100%';paper.style.transform='scale('+sc+')';wrap.style.height=Math.ceil(paper.offsetHeight*sc)+'px';
}
document.body.className+=' m-fill';
window.addEventListener('resize',fitPaper);
window.addEventListener('orientationchange',function(){setTimeout(fitPaper,150);});
if(window.ResizeObserver){new ResizeObserver(function(){fitPaper();}).observe(document.getElementById('paper'));}
fitPaper();
</script>
