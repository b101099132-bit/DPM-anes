<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta http-equiv="Cache-Control" content="no-cache, must-revalidate"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻醉部自費預計清單（備物）</title>
<style>
  :root{--blue:#1d5fa8;--blue-d:#15457a;--line:#c9d4e0;--bg:#f3f6fa;--ink:#1b2733;--ok:#1f7a3a;--warn:#9a6a00;--bad:#a32424;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans CJK TC",sans-serif;color:var(--ink);background:var(--bg);}
  .top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:2px solid var(--blue);position:sticky;top:0;z-index:5;flex-wrap:wrap;}
  .top img{height:40px;}
  .top h1{font-size:16px;margin:0;color:var(--blue-d);}
  .top .t2{font-size:12px;color:#6b7886;}
  .top .sp{flex:1;}
  .gear{font-size:12px;color:var(--blue);cursor:pointer;text-decoration:underline;}
  .wrap{max-width:1100px;margin:0 auto;padding:14px 16px 60px;}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;}
  .bar input,.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:14px;font-family:inherit;}
  .btn{padding:8px 14px;border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:#eef2f7;color:var(--ink);}
  .btn-pri{background:var(--blue);color:#fff;}.btn-pri:hover{background:var(--blue-d);}
  .btn-ok{background:var(--ok);color:#fff;}
  .btn-sm{padding:5px 10px;font-size:12.5px;}
  .msg{font-size:13px;color:#6b7886;min-height:1.2em;}
  .msg.bad{color:var(--bad);}.msg.ok{color:var(--ok);}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .card .k{font-size:12px;color:#6b7886;}.card .v{font-size:24px;font-weight:700;color:var(--blue-d);}
  .sec{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;}
  .sec h2{font-size:14px;margin:0 0 8px;color:var(--blue-d);display:flex;align-items:center;gap:8px;}
  .sec h2 .n{font-weight:400;color:#6b7886;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{border-bottom:1px solid #e3e9f0;padding:6px 6px;text-align:left;vertical-align:middle;}
  th{background:#f7faff;color:var(--blue-d);font-weight:600;white-space:nowrap;}
  td.r,th.r{text-align:right;white-space:nowrap;}
  td.c,th.c{text-align:center;}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;}
  .t-plan{background:#fff2d6;color:var(--warn);}.t-done{background:#e2f1e6;color:var(--ok);}.t-tbd{background:#eee;color:#555;}.t-adhoc{background:#fde2e2;color:var(--bad);}
  .pt{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;overflow:hidden;}
  .pt .hd{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;flex-wrap:wrap;}
  .pt .hd:hover{background:#f7faff;}
  .pt .hd b{font-size:15px;}
  .pt .hd .sub{color:#6b7886;font-size:12.5px;}
  .pt .hd .sp{flex:1;}
  .pt .bd{display:none;border-top:1px dashed var(--line);padding:10px 12px;background:#fcfdff;}
  .pt.open .bd{display:block;}
  .bd input[type=number]{width:64px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit;text-align:right;}
  .bd input[type=text],.bd select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-family:inherit;}
  .bd .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0;}
  .bd .row label{font-size:12.5px;color:#52616f;}
  tr.sub td{color:#52616f;font-size:12.5px;}
  tr.sub td.nm{padding-left:26px;}
  tr.zero td{color:#aaa;text-decoration:line-through;}
  tr.zero td.ctl,tr.zero td.nm{text-decoration:none;}
  .adhoc{border:1px dashed #d8a;background:#fffdf6;border-radius:8px;padding:8px 10px;margin-top:8px;}
  .adhoc .hits{max-height:160px;overflow:auto;margin-top:6px;}
  .adhoc .hit{padding:5px 8px;border-bottom:1px solid #f0e6d0;cursor:pointer;font-size:13px;}
  .adhoc .hit:hover{background:#fff3e0;}
  .diff{font-size:12px;color:var(--bad);font-weight:600;}
  .tabs{display:flex;gap:6px;margin-bottom:10px;}
  .tb{padding:9px 16px;border:1px solid var(--line);border-radius:20px;background:#fff;font-size:14px;font-weight:700;color:#6b7886;cursor:pointer;font-family:inherit;}
  .tb.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .empty{color:#9aa7b4;text-align:center;padding:24px;font-size:14px;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20;}
  .modal.on{display:flex;}
  .modal .box{background:#fff;border-radius:12px;padding:18px 20px;max-width:420px;width:92%;}
  .modal .box h3{margin:0 0 8px;font-size:16px;color:var(--blue-d);}
  .modal .box input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:14px;font-family:inherit;margin:8px 0;}
  .modal .box p{font-size:12.5px;color:#52616f;margin:4px 0;}
  @media print{
    body{background:#fff;} .top,.bar,.btn,.gear,.adhoc,.pt .bd,.noprint{display:none !important;}
    .wrap{max-width:none;padding:0;} .sec,.card,.pt{border-color:#999;break-inside:avoid;}
    .pt .hd{cursor:default;} .cards{grid-template-columns:repeat(4,1fr);}
    @page{size:A4;margin:12mm;}
  }
  @media screen and (max-width:700px){
    .wrap{padding:10px 10px 70px;} th,td{padding:5px 4px;font-size:12.5px;} .pt .hd b{font-size:14px;}
    .bd input[type=number]{width:56px;font-size:16px;} .bd input[type=text],.bd select,.bar input,.bar select{font-size:16px;}
  }
</style>
</head>
<body>
<div class="top"><img id="logo" alt=""><div><h1 id="title"></h1><div class="t2" id="subt"></div></div><div class="sp"></div><span class="gear" onclick="openToken()">⚙ 連線設定</span></div>
<div class="wrap">

  <div id="viewDay">
  <div class="bar">
    <label>手術日</label><input type="date" id="qDate">
    <button class="btn btn-sm" onclick="setDay(0)">今天</button><button class="btn btn-sm" onclick="setDay(1)">明天</button>
    <span style="color:#9aa7b4">｜</span>
    <input type="text" id="qMrn" placeholder="或輸入病歷號查（含日期未定）" style="min-width:200px">
    <button class="btn btn-pri" onclick="load()">查詢</button>
    <button class="btn btn-sm" onclick="window.print()">列印備物清單</button>
    <span class="msg" id="msg"></span>
  </div>
  <div class="cards" id="cards"></div>
  <div class="sec" id="secSum"><h2>備物總表 <span class="n" id="sumN"></span></h2><div id="sumTbl"></div></div>
  <div class="sec"><h2>病人清單 <span class="n" id="ptN"></span><span class="n noprint">（點病人展開核對）</span></h2><div id="pts"></div></div>
  </div>
  <div id="viewMon" style="display:none">
    <div class="bar"><label>月份</label><input type="month" id="qMonth"><button class="btn btn-pri" onclick="loadMonth()">查詢</button><button class="btn btn-sm" onclick="downloadCsv()">下載 CSV</button><button class="btn btn-sm" onclick="window.print()">列印</button><span class="msg" id="mmsg"></span></div>
    <div class="cards" id="mcards"></div>
    <div class="sec"><h2>各品項：預計 vs 實際 <span class="n">（件數＝病人數；未使用＝預計有、實際填 0；臨時＝預計沒有、當天新增）</span></h2><div id="mtbl"></div></div>
    <div class="sec"><h2>未核對病人 <span class="n" id="muN"></span></h2><div id="mun"></div></div>
  </div>
</div>
<datalist id="byList"></datalist>
<div class="modal" id="tokModal"><div class="box"><h3>連線設定</h3><p>後端網址：<span id="apiShow" style="word-break:break-all"></span></p><p>第一次使用請輸入後端金鑰（向管理者索取），只需輸入一次，會記在這台電腦的瀏覽器。</p><input id="tokInp" type="password" placeholder="後端金鑰 API_TOKEN"><div id="atokRow" style="display:none"><p>管理頁需「管理員金鑰」（只給管理者）。</p><input id="atokInp" type="password" placeholder="管理員金鑰 ADMIN_TOKEN"></div><div id="ctokRow" style="display:none"><p>核對頁另需「核對金鑰」（只給當責麻醉護理師），送出核對結果時驗證。</p><input id="ctokInp" type="password" placeholder="核對金鑰 CHECK_TOKEN"></div><div class="row" style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="closeToken()">取消</button><button class="btn btn-pri" onclick="saveToken()">儲存並測試</button></div><p id="tokMsg" class="msg"></p></div></div>

    PH=idx(res.headers);PIH=idx(res.itemHeaders);PLANS=res.plans;PITEMS=res.items;
    jsonp({action:'actuals',date:mrn?'':date},function(r2){
      if(r2&&r2.ok){AH=idx(r2.headers);AIH=idx(r2.itemHeaders);ACT=r2.rows;AITEMS=r2.items;}else{ACT=[];AITEMS=[];}
      if(mrn){ /* 依病歷號時實際使用也要全撈：以序號過濾 */ ACT=ACT.filter(function(a){return PLANS.some(function(p){return p[PH['同意書編號']]===a[AH['同意書編號']];});}); }
      render();msg(PLANS.length?"":"此日期沒有預計清單","");
    },function(){ACT=[];AITEMS=[];render();});
  },function(w){msg("✖ 無法連線後端（"+w+"）","bad");});
}
function planItems(serial){return PITEMS.filter(function(r){return r[PIH['同意書編號']]===serial;});}
function actRow(serial){return ACT.find(function(a){return a[AH['同意書編號']]===serial;});}
function actItems(serial){return AITEMS.filter(function(r){return r[AIH['同意書編號']]===serial;});}
function render(){
  var done=0,total=0,n=PLANS.length;
  var sum={};
  PLANS.forEach(function(p){var s=p[PH['同意書編號']];if(actRow(s))done++;total+=Number(p[PH['合計']])||0;
    planItems(s).forEach(function(it){if(it[PIH['是否子項']]==='Y')return;var k=it[PIH['收費代碼']];sum[k]=sum[k]||{code:k,name:it[PIH['品項名稱']],qty:0,n:0};sum[k].qty+=Number(it[PIH['數量']])||0;sum[k].n++;});});
  document.getElementById("cards").innerHTML='<div class="card"><div class="k">病人數</div><div class="v">'+n+'</div></div><div class="card"><div class="k">已核對</div><div class="v">'+done+'</div></div><div class="card"><div class="k">待核對</div><div class="v">'+(n-done)+'</div></div>';
  var keys=Object.keys(sum).sort(function(a,b){return sum[b].qty-sum[a].qty;});
  document.getElementById("sumN").textContent=keys.length?"（"+keys.length+" 種品項）":"";
  document.getElementById("sumTbl").innerHTML=keys.length?'<table><tr><th>代碼</th><th>品項</th><th class="r">預計總量</th><th class="r">病人數</th></tr>'+keys.map(function(k){var s=sum[k];return '<tr><td>'+esc(s.code)+'</td><td>'+esc(s.name)+'</td><td class="r"><b>'+s.qty+'</b></td><td class="r">'+s.n+'</td></tr>';}).join('')+'</table>':'<div class="empty">—</div>';
  document.getElementById("ptN").textContent=n?"（"+n+" 位）":"";
  var box=document.getElementById("pts");
  if(!n){box.innerHTML='<div class="empty">沒有資料</div>';return;}
  box.innerHTML=PLANS.map(function(p,i){
    var s=p[PH['同意書編號']],a=actRow(s),tbd=p[PH['日期未定']]==='Y';
    var its=planItems(s).filter(function(r){return r[PIH['是否子項']]!=='Y';}).map(function(r){return esc(r[PIH['品項名稱']])+'×'+r[PIH['數量']];}).join('、');
    var chk=a?('已核對'+((AH['核對次數']!=null&&Number(a[AH['核對次數']])>1)?'×'+a[AH['核對次數']]:'')):'';
    var who=a?('<span class="sub">'+esc(a[AH['填寫人']]||'')+' '+esc(String(a[AH['送出時間']]||'').slice(5,16).replace('T',' '))+'</span>'):'';
    return '<div class="pt" id="pt'+i+'"><div class="hd" '+(MODE==='check'?'onclick="togglePt('+i+')"':'style="cursor:default"')+'>'+(a?'<span class="tag t-done" title="最後核對">'+chk+'</span>':'<span class="tag t-plan">待核對</span>')+who+(tbd?'<span class="tag t-tbd">日期未定</span>':'')+
      '<b>'+esc(p[PH['病歷號']])+'</b><span class="sub">'+esc(p[PH['手術科別']]||'')+(p[PH['術式']]?'｜'+esc(p[PH['術式']]):'')+'</span><span class="sub">'+esc(p[PH['告知醫師']]||'')+'｜'+esc(p[PH['院區']]||'')+'</span><span class="sp"></span><span class="sub">'+esc(s)+'</span><span class="sub">'+p[PH['品項數']]+' 項</span>'+(MODE==='check'?'':'<div class="its" style="flex-basis:100%;font-size:12.5px;color:#52616f">'+its+'</div>')+'</div><div class="bd" id="bd'+i+'"></div></div>';
  }).join('');
}
function togglePt(i){var el=document.getElementById("pt"+i);var open=el.className.indexOf("open")>=0;el.className="pt"+(open?"":" open");if(!open)renderBody(i);}
/* ---- 核對表身 ---- */
var EDIT={};
function renderBody(i){
  var p=PLANS[i],s=p[PH['同意書編號']],pits=planItems(s),a=actRow(s),aits=actItems(s);
  if(!EDIT[s]){ /* 初始化：有實際紀錄用實際，否則以預計帶入 */
    var lines=[];
    if(aits.length){aits.forEach(function(r){lines.push({code:r[AIH['收費代碼']],name:r[AIH['品項名稱']],qty:Number(r[AIH['數量']])||0,price:Number(r[AIH['單價']])||0,adhoc:r[AIH['是否臨時新增']]==='Y',isSub:(AIH['是否子項']!=null)&&r[AIH['是否子項']]==='Y',parent:(AIH['母項代碼']!=null)?r[AIH['母項代碼']]:'',plan:null});});}
    else{pits.forEach(function(r){lines.push({code:r[PIH['收費代碼']],name:r[PIH['品項名稱']],qty:Number(r[PIH['數量']])||0,price:Number(r[PIH['單價']])||0,adhoc:false,isSub:r[PIH['是否子項']]==='Y',parent:r[PIH['母項代碼']]||'',plan:Number(r[PIH['數量']])||0});});}
    /* 補上預計數量對照 */
    lines.forEach(function(l){if(l.plan==null){var pr=pits.find(function(r){return r[PIH['收費代碼']]===l.code&&(r[PIH['是否子項']]==='Y')===l.isSub;});l.plan=pr?Number(pr[PIH['數量']])||0:0;}});
    EDIT[s]={lines:lines,room:a?a[AH['場域']]:'',by:'',note:a?a[AH['備註']]:''};
  }
  var e=EDIT[s],h='';
  if(!canEdit(p)){h='<div class="empty">手術日尚未到（'+esc(p[PH['預計手術日']])+'），當天才能核對。</div>';document.getElementById("bd"+i).innerHTML=h;return;}
  if(a){h+='<div class="msg" style="margin-bottom:4px">上次核對：'+esc(a[AH['填寫人']]||'')+'（'+esc(String(a[AH['送出時間']]||'').slice(0,16).replace('T',' '))+'）'+((AH['首次核對人']!=null&&a[AH['首次核對人']]&&a[AH['首次核對人']]!==a[AH['填寫人']])?'；首次：'+esc(a[AH['首次核對人']]):'')+'。再次送出會以本次內容覆蓋，每次送出都會留存歷程。</div>';}
  h+='<div class="row"><label>場域</label><select id="room'+i+'" onchange="EDIT[\''+s+'\'].room=this.value"><option value=""></option>'+(CONFIG.rooms||[]).map(function(r){return '<option'+(e.room===r?' selected':'')+'>'+esc(r)+'</option>';}).join('')+'</select><label>核對人員（員工代碼）</label><input type="text" id="by'+i+'" list="byList" value="'+esc(e.by)+'" oninput="EDIT[\''+s+'\'].by=this.value.trim()" placeholder="員工代碼" autocomplete="off" style="width:120px"><label>備註</label><input type="text" id="note'+i+'" value="'+esc(e.note)+'" oninput="EDIT[\''+s+'\'].note=this.value" style="flex:1;min-width:160px"></div>';
  h+='<table><tr><th>代碼</th><th>品項</th><th class="r">預計</th><th class="r">實際</th><th class="c">未使用</th><th class="r">單價</th><th></th></tr>';
  e.lines.forEach(function(l,j){
    var d=(l.qty!==l.plan)?'<span class="diff">'+(l.qty>l.plan?'+':'')+(l.qty-l.plan)+'</span>':'';
    h+='<tr class="'+(l.isSub?'sub ':'')+(l.qty===0?'zero':'')+'"><td>'+esc(l.code)+'</td><td class="nm">'+(l.adhoc?'<span class="tag t-adhoc">臨時</span> ':'')+esc(l.name)+'</td><td class="r">'+(l.adhoc?'—':l.plan)+'</td><td class="r ctl"><input type="number" min="0" value="'+l.qty+'" onchange="setQty(\''+s+'\','+j+',this.value)"> '+d+'</td><td class="c ctl"><input type="checkbox" '+(l.qty===0?'checked':'')+' onchange="zeroLine(\''+s+'\','+j+',this.checked)"></td><td class="r">'+(l.price?money(l.price):'')+'</td><td class="ctl">'+(l.adhoc?'<a style="color:var(--bad);cursor:pointer;font-size:12px" onclick="delLine(\''+s+'\','+j+')">移除</a>':'')+'</td></tr>';
  });
  h+='</table>';
  h+='<div class="adhoc"><b style="font-size:12.5px;color:#8a5a12">臨時新增（預計清單沒有、當天實際使用的品項）</b><div class="row"><input type="text" placeholder="搜尋品名／代碼" oninput="hits(\''+s+'\','+i+',this.value)" style="flex:1;min-width:200px"></div><div class="hits" id="hits'+i+'"></div></div>';
  h+='<div class="row" style="justify-content:flex-end"><span class="msg" id="smsg'+i+'"></span><button class="btn btn-ok" onclick="submitActual('+i+')">'+(a?'更新核對結果':'送出核對結果')+'</button></div>';
  document.getElementById("bd"+i).innerHTML=h;
}
function setQty(s,j,v){EDIT[s].lines[j].qty=Math.max(0,parseInt(v)||0);refreshOpen(s);}
function zeroLine(s,j,on){var l=EDIT[s].lines[j];if(on){l._keep=l.qty;l.qty=0;}else{l.qty=l._keep||l.plan||1;}refreshOpen(s);}
function delLine(s,j){EDIT[s].lines.splice(j,1);refreshOpen(s);}
function refreshOpen(s){for(var i=0;i<PLANS.length;i++){if(PLANS[i][PH['同意書編號']]===s){renderBody(i);break;}}}
function hits(s,i,q){q=(q||"").trim().toLowerCase();var box=document.getElementById("hits"+i);if(!q){box.innerHTML="";return;}
  var pool=ITEMS.filter(function(it){return it.name.toLowerCase().indexOf(q)>=0||String(it.code).toLowerCase().indexOf(q)>=0;}).slice(0,12);
  box.innerHTML=pool.map(function(it){return '<div class="hit" onclick="addLine(\''+s+'\','+i+',\''+esc(it.code).replace(/'/g,"\\'")+'\')">'+esc(it.name)+' <span style="color:#9aa7b4">'+esc(it.code)+'｜NT$ '+money(it.price)+'</span></div>';}).join('')||'<div class="hit">查無品項</div>';
}
function addLine(s,i,code){var it=ITEMMAP[code];if(!it)return;EDIT[s].lines.push({code:it.code,name:it.name,qty:1,price:it.price,adhoc:true,isSub:false,parent:'',plan:0});renderBody(i);}
function submitActual(i){
  var p=PLANS[i],s=p[PH['同意書編號']],e=EDIT[s],m=document.getElementById("smsg"+i);
  if(!e.by){m.textContent="請輸入核對人員員工代碼";m.className="msg bad";return;}
  if(!ctoken()){m.textContent="請先在「⚙ 連線設定」輸入核對金鑰";m.className="msg bad";openToken();return;}
  try{var rb=JSON.parse(localStorage.getItem(TKEY+'_bylist')||'[]');rb=[e.by].concat(rb.filter(function(x){return x!==e.by;})).slice(0,8);localStorage.setItem(TKEY+'_bylist',JSON.stringify(rb));fillByList();}catch(x){}
  var items=e.lines.map(function(l){return {code:l.code,name:l.name,qty:l.qty,price:l.price,amount:l.isSub?'':(l.qty*l.price),adhoc:l.adhoc,isSub:l.isSub,parent:l.parent};});
  var total=0;items.forEach(function(x){if(!x.isSub)total+=Number(x.amount)||0;});
  var rec={serial:s,mrn:p[PH['病歷號']],surgDate:p[PH['預計手術日']]||document.getElementById("qDate").value,room:e.room,by:e.by,note:e.note,items:items,total:total,sentAt:new Date().toISOString()};
  m.textContent="送出中…";m.className="msg";
  post({action:'saveActual',ctoken:ctoken(),data:JSON.stringify(rec)},function(){
    setTimeout(function(){jsonp({action:'actuals',date:rec.surgDate},function(res){
      var ok=res&&res.ok&&res.rows.some(function(r){return r[idx(res.headers)['同意書編號']]===s;});
      if(ok){m.textContent="✔ 已儲存";m.className="msg ok";delete EDIT[s];load();}else{jsonp({action:'checkAuth',ctoken:ctoken()},function(r3){m.textContent=(r3&&r3.ok)?"⚠ 伺服器尚未確認，請稍後重新查詢":"✖ 核對金鑰錯誤，請在「⚙ 連線設定」重新輸入";m.className="msg bad";},function(){m.textContent="⚠ 無法回讀確認";m.className="msg bad";});}
    },function(){m.textContent="⚠ 無法回讀確認，請重新查詢";m.className="msg bad";});},1500);
  });
}
/* ---- 月統計 ---- */
var MON=null;
function setTab(w){document.getElementById("viewDay").style.display=w==='day'?'':'none';document.getElementById("viewMon").style.display=w==='mon'?'':'none';}
function loadMonth(){
  if(!token()){openToken();return;}
  var m=document.getElementById("qMonth").value;if(!m){msgM("請選月份","bad");return;}
  var from=m+'-01',d=new Date(parseInt(m.slice(0,4)),parseInt(m.slice(5,7)),0),to=m+'-'+String(d.getDate()).padStart(2,'0');
  msgM("讀取中…");
  jsonp({action:'summary',from:from,to:to,atoken:atoken()},function(res){
    if(!res||!res.ok){msgM("✖ "+(res&&res.error||"讀取失敗"),"bad");return;}
    MON=res.data;MON.month=m;renderMonth();msgM("");
  },function(w){msgM("✖ 無法連線（"+w+"）","bad");});
}
function msgM(t,c){var m=document.getElementById("mmsg");m.textContent=t||"";m.className="msg "+(c||"");}
function renderMonth(){
  var d=MON,rows=d.byCode,amt=0;rows.forEach(function(r){amt+=r.amount;});
  document.getElementById("mcards").innerHTML='<div class="card"><div class="k">病人數</div><div class="v">'+d.patients+'</div></div><div class="card"><div class="k">已核對</div><div class="v">'+d.checked+'</div></div><div class="card"><div class="k">未核對</div><div class="v" style="color:'+(d.unchecked.length?'var(--bad)':'inherit')+'">'+d.unchecked.length+'</div></div><div class="card"><div class="k">實際自費金額（已核對）</div><div class="v" style="font-size:18px">NT$ '+money(amt)+'</div></div>';
  document.getElementById("mtbl").innerHTML=rows.length?'<table><tr><th>代碼</th><th>品項</th><th class="r">預計件數</th><th class="r">實際件數</th><th class="r">實際數量</th><th class="r">未使用</th><th class="r">臨時</th><th class="r">實際金額</th></tr>'+rows.map(function(r){var warn=(r.unused||r.adhoc)?' style="color:var(--bad);font-weight:600"':'';return '<tr><td>'+esc(r.code)+'</td><td>'+esc(r.name)+'</td><td class="r">'+r.planned+'</td><td class="r">'+r.actual+'</td><td class="r">'+r.actualQty+'</td><td class="r"'+(r.unused?warn:'')+'>'+r.unused+'</td><td class="r"'+(r.adhoc?warn:'')+'>'+r.adhoc+'</td><td class="r">'+money(r.amount)+'</td></tr>';}).join('')+'</table>':'<div class="empty">本月沒有資料</div>';
  document.getElementById("muN").textContent="（"+d.unchecked.length+" 位）";
  document.getElementById("mun").innerHTML=d.unchecked.length?'<table><tr><th>手術日</th><th>病歷號</th><th>科別</th><th>告知醫師</th><th>同意書編號</th><th class="r">預計金額</th></tr>'+d.unchecked.map(function(u){return '<tr><td>'+esc(u.date)+'</td><td>'+esc(u.mrn)+'</td><td>'+esc(u.dept)+'</td><td>'+esc(u.doctor)+'</td><td>'+esc(u.serial)+'</td><td class="r">'+money(u.total)+'</td></tr>';}).join('')+'</table>':'<div class="empty">全部已核對</div>';
}
function downloadCsv(){
  if(!MON){msgM("請先查詢","bad");return;}
  var lines=[["月份","代碼","品項","預計件數","實際件數","實際數量","未使用","臨時新增","實際金額"]];
  MON.byCode.forEach(function(r){lines.push([MON.month,r.code,r.name,r.planned,r.actual,r.actualQty,r.unused,r.adhoc,r.amount]);});
  var csv="\ufeff"+lines.map(function(l){return l.map(function(x){x=String(x==null?"":x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(",");}).join("\r\n");
  var blob=new Blob([csv],{type:"text/csv"}),fn="anes_selfpay_"+MON.month.replace('-','')+".csv";
  if(navigator.msSaveOrOpenBlob){navigator.msSaveOrOpenBlob(blob,fn);}else{var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);},100);}
}
function fillByList(){var dl=document.getElementById("byList");if(!dl)return;var rb=[];try{rb=JSON.parse(localStorage.getItem(TKEY+'_bylist')||'[]');}catch(x){}dl.innerHTML=rb.map(function(x){return '<option value="'+esc(x)+'">';}).join('');}
/* ---- init ---- */
document.getElementById("logo").src=LOGO;document.getElementById("title").textContent=(MODE==="check"?(CONFIG.checkTitle||"自費當日核對"):(CONFIG.prepTitle||"自費預計清單（備物）"));
document.getElementById("subt").textContent=MODE==="check"?"手術當天由當責麻醉護理師逐一核對實際使用並送出（需核對金鑰；手術日未到不可核對）":(MODE==="admin"?"月統計／差異：各品項預計 vs 實際、未使用、臨時新增、未核對病人；CSV 匯出（需管理員金鑰）":"查詢任一天的預計自費品項與備物總表（唯讀，可列印）");
if(MODE==="admin")document.getElementById("title").textContent=CONFIG.adminTitle||"麻醉部自費月統計（管理）";
setTab(MODE==="admin"?"mon":"day");
document.getElementById("qDate").value=iso(new Date());document.getElementById("qMonth").value=iso(new Date()).slice(0,7);fillByList();
document.getElementById("qMrn").addEventListener("keydown",function(e){if(e.keyCode===13)load();});
if(MODE==="admin"){if(token()&&atoken())loadMonth();else openToken();}else{if(token())load();else openToken();}
</script>
</body></html>
