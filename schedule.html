<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麻醉科班表 | 耕莘醫院麻醉部</title>
<style>
  body { font-family: "Microsoft JhengHei", system-ui, sans-serif; background: #f0f4f8; margin: 0; padding: 16px; }
  .wrap { max-width: 1250px; margin: 0 auto; }
  h1 { font-size: 1.25rem; color: #1a3c5e; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.06); padding: 16px 18px; margin-bottom: 14px; }
  select { padding: 7px; border: 1px solid #bcd; border-radius: 6px; font-size: 1rem; }
  button { padding: 9px 16px; font-size: .95rem; border: 0; border-radius: 7px; background: #1a5e9e; color: #fff; cursor: pointer; }
  .grid-scroll { overflow-x: auto; }
  #status { color: #789; }
  .err { color: #c0392b; font-weight: bold; }
  /* 總班表 */
  table.master { border-collapse: collapse; font-size: .85rem; white-space: nowrap; }
  table.master th, table.master td { border: 1px solid #999; padding: 2px 6px; text-align: center; min-width: 26px; }
  table.master th { background: #eef4fa; color: #1a3c5e; }
  td.lbl { font-weight: bold; background: #f7fafd; text-align: left; min-width: 78px; }
  td.datehead { font-weight: bold; background: #fdfdf2; }
  td.gray { background: #a6a6a6; }
  td.prevday { color: #888; background: #f4f4f4; }
  td.prevday.datehead { color: #666; }
</style>
</head>
<body>
<div class="wrap">
  <h1>耕莘醫院麻醉部｜班表查詢</h1>
  <div class="card">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <label>月份</label><select id="monthSel"></select>
      <button onclick="dlPng()">總班表（圖片）</button>
      <button onclick="dlHospitalDoc()">醫院格式-醫療作業表（Word）</button>
      <button onclick="dlAnkangDoc()">安康值班表（Word）</button>
      <span id="status">載入中…</span>
    </div>
  </div>

  <div class="card">
    <div class="grid-scroll" id="master"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="config.js?v=6"></script>
<script src="common.js?v=6"></script>
<script>
var DATA = null, DIM = 0, Y = 0, M = 0, PDIM = 0, PY = 0, PM = 0;

init();

function init() {
  document.getElementById('monthSel').onchange = function () { load(this.value); };
  // 先用本機快取立即顯示（若有），同時向後端要最新資料
  var last = cacheGet('schedLastMonth');
  if (last) {
    var cached = cacheGet('schedData_' + last);
    if (cached) applyData(cached, true);
  }
  load(last || '');
}

function load(month) {
  document.getElementById('status').textContent = '更新中…';
  var p = { action: 'schedule' };
  if (month) p.month = month;
  jsonp(p, function (res) {
    if (!res || !res.ok) {
      document.getElementById('status').innerHTML = '<span class="err">' + ((res && res.error) || '載入失敗') + '</span>';
      return;
    }
    cacheSet('schedData_' + res.month, res);
    cacheSet('schedLastMonth', res.month);
    applyData(res, false);
  });
}

function cacheGet(k) {
  try { var v = sessionStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; }
}
function cacheSet(k, v) {
  try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}

function applyData(res, fromCache) {
  DATA = res;
  var sel = document.getElementById('monthSel');
  var months = res.months || [res.month];
  sel.innerHTML = months.map(function (m) { return '<option>' + m + '</option>'; }).join('');
  sel.value = res.month;
  var p = res.month.split('/');
  Y = parseInt(p[0], 10) + 1911; M = parseInt(p[1], 10);
  DIM = new Date(Y, M, 0).getDate();
  PM = M - 1; PY = Y;
  if (PM < 1) { PM = 12; PY -= 1; }
  PDIM = new Date(PY, PM, 0).getDate();
  document.getElementById('status').textContent = fromCache ? '更新中…' : '';
  document.getElementById('master').innerHTML = buildMaster(false);
}

function abbrOf(name) {
  var d = DATA.doctors.filter(function (x) { return x.name === name; })[0];
  return d ? d.abbr : name;
}
// day > 0 本月；day <= 0 代表上月（0=上月最後一天）
function whoOn(shift, day) {
  var roster = day > 0 ? DATA.roster : DATA.prevRoster;
  var idx = day > 0 ? day - 1 : PDIM + day - 1;
  var names = Object.keys(roster).filter(function (n) { return String(roster[n][idx] || '') === shift; });
  return names.length ? abbrOf(names[0]) : '';
}
function dispDay(day) { return day > 0 ? day : PDIM + day; }
function cfgList(h) {
  if (!DATA.cfg) return [];
  return String(DATA.cfg[DATA.cfgHeaders.indexOf(h)] || '').split(/[,，]/)
    .map(function (s) { return parseInt(s, 10); }).filter(function (n) { return n >= 1; });
}

// Word 用醫師順序：鄒部長排第一，其餘照主檔排序
function docsForWord() {
  var z = DATA.doctors.filter(function (d) { return d.name === '鄒美勇'; });
  return z.concat(DATA.doctors.filter(function (d) { return d.name !== '鄒美勇'; }));
}
// NIL 標記（月設定：20=聖母,5=值班）
function isNil(d, s) {
  if (d < 1 || !DATA.cfg) return false;
  var raw = String(DATA.cfg[DATA.cfgHeaders.indexOf('NIL標記')] || '');
  if (!raw) return false;
  return raw.split(/[,，]/).some(function (x) {
    var m = x.trim().split('=');
    return parseInt(m[0], 10) === d && m[1] === s;
  });
}
function whoOrNil(shift, d) {
  var w = whoOn(shift, d);
  return w || (isNil(d, shift) ? 'NIL' : '');
}

// D 欄（二線）：本月格子有二線班者優先，否則預設鄒；二線不排日留空；上月日一律只看格子，否則鄒
function secondLine(day) {
  var g = whoOn('二線班', day);
  if (g) return g;
  if (day > 0 && cfgList('二線不排日').indexOf(day) >= 0) return '';
  return '鄒';
}

function buildMaster(forDoc) {
  var bd = forDoc ? ' style="border:1px solid #000;padding:2px 6px;text-align:center"' : '';
  var lbl = forDoc ? ' style="border:1px solid #000;padding:2px 6px;font-weight:bold;text-align:left"' : ' class="lbl"';
  var dh = forDoc ? ' style="border:1px solid #000;padding:2px 6px;text-align:center;font-weight:bold"' : ' class="datehead"';
  var gray = forDoc ? ' style="border:1px solid #000;background:#a6a6a6"' : ' class="gray"';
  function td(cls, colspan, content) {
    return '<td' + cls + (colspan > 1 ? ' colspan="' + colspan + '"' : '') + '>' + (content || '') + '</td>';
  }
  var h = '<table class="master"' + (forDoc ? ' style="border-collapse:collapse;font-family:標楷體,serif"' : '') + '>';
  // 表頭
  h += '<tr>' + td(lbl, 1, '') ;
  ['星期一', '星期二', '星期三', '星期四', '星期五'].forEach(function (w) { h += td(bd, 4, w); });
  h += td(bd, 1, '星期六') + td(bd, 1, '星期日') + '</tr>';
  h += '<tr>' + td(lbl, 1, '');
  for (var i = 0; i < 5; i++) { ['B', 'C', 'D', 'E'].forEach(function (x) { h += td(bd, 1, x); }); }
  h += td(bd, 1, '') + td(bd, 1, '') + '</tr>';

  // 週起點：本月1日所在週的週一（可能落在上月）
  var dow1 = new Date(Y, M - 1, 1).getDay(); // 0=日
  var start = 1 - ((dow1 + 6) % 7);
  for (var wk = start; wk <= DIM; wk += 7) {
    var days = [];
    for (var k = 0; k < 7; k++) days.push(wk + k); // 一..日
    // 日期列
    h += '<tr>' + td(lbl, 1, '');
    days.forEach(function (d, i) {
      var cls = (d < 1 ? (forDoc ? bd : ' class="datehead prevday"') : dh);
      var span = i < 5 ? 4 : 1;
      h += td(cls, span, (d > DIM ? '' : dispDay(d)));
    });
    h += '</tr>';
    // 胃鏡/白班
    h += '<tr>' + td(lbl, 1, '胃鏡/白班');
    days.forEach(function (d, i) {
      if (i >= 5) { h += td(bd, 1, ''); return; }
      if (d > DIM || (d < 1 && !Object.keys(DATA.prevRoster).length)) { h += td(bd, 4, ''); return; }
      var mir = whoOrNil('鏡檢', d), wt = whoOrNil('白班', d);
      if (!mir && !wt && d < 1) { h += td(bd, 4, ''); return; }
      h += td(bd, 1, (mir && mir !== 'NIL') ? '胃' + mir : mir) + td(bd, 1, wt) + td(bd, 1, (mir || wt) ? secondLine(d) : '') + td(bd, 1, '');
    });
    h += '</tr>';
    // 值班(A)
    h += '<tr>' + td(lbl, 1, '值班(A)');
    days.forEach(function (d, i) {
      h += td(bd, i < 5 ? 4 : 1, (d > DIM ? '' : whoOrNil('值班', d)));
    });
    h += '</tr>';
    // 安康
    h += '<tr>' + td(lbl, 1, '安康');
    days.forEach(function (d, i) {
      h += td(bd, i < 5 ? 4 : 1, (d > DIM ? '' : whoOrNil('安康', d)));
    });
    h += '</tr>';
    // 羅東聖母
    h += '<tr>' + td(lbl, 1, '羅東聖母');
    days.forEach(function (d, i) {
      if (i >= 2) { h += td(gray, i < 5 ? 4 : 1, ''); return; } // 週三之後灰色
      if (d > DIM) { h += td(bd, 4, ''); return; }
      var st = whoOrNil('聖母', d);
      // 該週一二皆無聖母 → NIL（僅本月日顯示）
      if (!st && d >= 1) {
        var mate = i === 0 ? days[1] : days[0];
        var mateSt = (mate >= 1 && mate <= DIM) ? whoOn('聖母', mate) : '';
        st = mateSt ? '' : 'NIL';
      }
      h += td(bd, 4, st);
    });
    h += '</tr>';
  }
  h += '</table>';
  return h;
}

// Word 相容 HTML（含 A4 版面與邊界設定，單位 mm：上/右/下/左）
function wordBlob(title, bodyHtml, filename, mg) {
  mg = mg || [20, 25, 25, 25];
  var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">' +
    '<head><meta charset="utf-8"><title>' + title + '</title>' +
    '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->' +
    '<style>@page Sec1{size:210mm 297mm;margin:' + mg[0] + 'mm ' + mg[1] + 'mm ' + mg[2] + 'mm ' + mg[3] + 'mm;mso-page-orientation:portrait;}' +
    'div.Sec1{page:Sec1}' +
    'body{font-family:標楷體,DFKai-SB,serif}' +
    'table{border-collapse:collapse}' +
    'td{border:1px solid #000;padding:1px 3px;text-align:center;font-family:標楷體,DFKai-SB,serif}</style>' +
    '</head><body><div class="Sec1">' + bodyHtml + '</div></body></html>';
  var blob = new Blob(['﻿' + html], { type: 'application/msword' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}
// 安康表醫師名固定配色（比照原檔多彩風格）
var DOC_COLORS = { '王': '#B8860B', '劉': '#000000', '李': '#E91E8C', '承': '#008000',
  '富': '#FF00FF', '楊': '#00008B', '謝': '#FF0000', '昀': '#00BFFF', '鄒': '#7030A0' };
function rocYM() {
  var p = document.getElementById('monthSel').value.split('/');
  return { y: p[0], m: p[1] };
}

// 醫院格式：醫療作業表（比照原檔：標楷體、標題16pt置中、表格10-11pt、章節一、二、四、五）
function dlHospitalDoc() {
  if (!DATA) return;
  var ym = rocYM();
  var docs = docsForWord();
  var SEC = 'style="font-size:12pt;margin:6pt 0 2pt;text-align:justify"';
  var NOTE = 'style="font-size:12pt;font-weight:bold;margin:2pt 0"';
  var h = '<p style="font-size:16pt;font-weight:bold;text-align:center;margin:0 0 6pt">麻醉部' + ym.y + '年' + ym.m + '月份醫師醫療作業表</p>';
  h += '<p ' + SEC + '>一、人力編制：</p>';
  h += '<table style="width:160mm;font-size:11pt"><tr><td style="width:14mm"></td>' +
    '<td colspan="2" style="width:49mm">主治醫師</td><td colspan="2" style="width:49mm">主治醫師</td><td colspan="2" style="width:48mm">主治醫師</td></tr>' +
    '<tr><td>專科</td><td>姓名</td><td>聯絡方式</td><td>姓名</td><td>聯絡方式</td><td>姓名</td><td>聯絡方式</td></tr>';
  for (var i = 0; i < docs.length; i += 3) {
    var rowA = '<tr><td>' + (i === 0 ? '麻醉科' : '') + '</td>';
    var rowB = '<tr><td></td>';
    for (var j = 0; j < 3; j++) {
      var d = docs[i + j];
      rowA += d ? '<td style="width:16mm">' + d.name + '</td><td style="width:33mm">' + d.ext + '</td>' : '<td></td><td></td>';
      rowB += d ? '<td></td><td>手機：' + d.phone + '</td>' : '<td></td><td></td>';
    }
    h += rowA + '</tr>' + rowB + '</tr>';
  }
  h += '</table><p ' + NOTE + '>備註： </p>';
  h += '<p ' + SEC + '>二、主治醫師值班、會診表：</p>';
  [[1, 16], [17, DIM]].forEach(function (seg) {
    h += '<table style="font-size:10pt"><tr><td style="width:13mm">日期</td>';
    for (var d = seg[0]; d <= seg[1]; d++) h += '<td style="width:9.2mm">' + d + '</td>';
    h += '</tr><tr><td>總院<br>值班</td>';
    for (var d1 = seg[0]; d1 <= seg[1]; d1++) h += '<td>' + whoOrNil('值班', d1) + '</td>';
    h += '</tr><tr><td>安康</td>';
    for (var d2 = seg[0]; d2 <= seg[1]; d2++) h += '<td>' + whoOrNil('安康', d2) + '</td>';
    h += '</tr></table><br>';
  });
  h += '<p ' + NOTE + '>備註：1.二線為昨值醫師<br>　　　2.值班醫師找不到,333,綠色狀況找二線(為昨值班)醫師,三線為明日值班醫師</p>';
  h += '<p ' + SEC + '>四、科內學術活動總表：</p>';
  h += '<table style="font-size:10.5pt"><tr><td style="width:25mm">時間</td><td style="width:25mm">星期一</td><td style="width:25mm">星期二</td><td style="width:25mm">星期三</td><td style="width:25mm">星期四</td><td style="width:22mm">星期五</td><td style="width:23mm">星期六</td></tr>' +
    '<tr><td>07:30～09:00</td><td>雜誌討論會</td><td></td><td></td><td>臨床討論會</td><td></td><td></td></tr>' +
    '<tr><td>09:00～12:00</td><td>臨床麻醉教學</td><td></td><td></td><td></td><td></td><td></td></tr>' +
    '<tr><td>12:00～13:00</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>' +
    '<tr><td>13:00～14:00</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>' +
    '<tr><td>13:00～14:30</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>' +
    '<tr><td>17:00～18:00</td><td></td><td></td><td></td><td></td><td></td><td></td></tr></table>' +
    '<p ' + NOTE + '>備註：每月第三週週四舉行臨床討論會</p>';
  h += '<p ' + SEC + '>五、注意事項：</p>' +
    '<p style="font-size:12pt;margin:2pt 0;text-align:justify">各醫療科總醫師或書記於每月28日前(若遇週六或假日則提前1-2日)，將該科次月「各科部醫師醫療作業表」電子檔案送交教研部。</p>';
  wordBlob('醫療作業表', h, ym.y + '-' + ym.m + '醫院格式.doc', [20, 25, 25, 25]);
}

// 安康值班表（比照原檔：標題18pt靠左、月曆16pt、平日淺綠/週末粉紅底色、醫師名彩色）
function dlAnkangDoc() {
  if (!DATA) return;
  var ym = rocYM();
  var GN = 'background:#EBF1DD', PK = 'background:#FFCCCC';
  function bg(col) { return col >= 5 ? PK : GN; } // col 0-4 平日, 5-6 週末
  var h = '<p style="font-size:18pt;font-weight:bold;margin:0 0 4pt">' + ym.y + '年' + ym.m + '月份麻醉科主治醫師值班表</p>';
  h += '<table style="font-size:16pt"><tr><td style="width:12mm;' + GN + '">星期</td>' +
    ['一', '二', '三', '四', '五', '六', '日'].map(function (w, i) {
      return '<td style="width:17mm;' + bg(i) + '">' + w + '</td>';
    }).join('') + '</tr>';
  var firstDow = (new Date(Y, M - 1, 1).getDay() + 6) % 7;
  var day = 1;
  while (day <= DIM) {
    var nums = '<tr><td style="' + GN + '"></td>', names = '<tr><td style="' + GN + '"></td>';
    for (var col = 0; col < 7; col++) {
      var b = bg(col);
      if ((day === 1 && col < firstDow) || day > DIM) {
        nums += '<td style="' + b + '"></td>'; names += '<td style="' + b + '"></td>'; continue;
      }
      var who = whoOn('安康', day);
      var color = DOC_COLORS[who] || '#000000';
      nums += '<td style="' + b + '">' + day + '</td>';
      names += '<td style="' + b + ';color:' + color + ';font-weight:bold">' + who + '</td>';
      day++;
    }
    h += nums + '</tr>' + names + '</tr>';
  }
  h += '</table><p style="font-size:12pt;margin-top:6pt">';
  docsForWord().forEach(function (d) {
    h += '*' + d.name + (d.name === '鄒美勇' ? '部長' : '醫師') + ':公務機:82' + d.ext + ' ' + d.phone + '<br>';
  });
  h += '*麻醉醫師上班<br>(平日一至五):08:00至17:00值班至24:00<br>(週六): 8AM-16:00值班至24:00<br>(週日):值班 8AM-16:00<br>例假日值班: 8AM-24:00</p>';
  wordBlob('安康值班表', h, ym.y + '年' + ym.m + '月份麻醉科主治醫師值班表-安康.doc', [20, 32, 20, 32]);
}

// 總班表 → PNG 圖片（高解析，適合 A4 橫向列印）
function dlPng() {
  if (!DATA) return;
  var m = document.getElementById('monthSel').value.split('/');
  var title = m[0] + '年' + m[1] + '月份麻醉科總班表';
  var el = document.querySelector('#master table');
  if (!el) return;
  // 暫時加上標題再截圖
  var box = document.createElement('div');
  box.style.cssText = 'position:absolute;left:-9999px;top:0;background:#fff;padding:16px';
  box.innerHTML = '<div style="text-align:center;font-weight:bold;font-size:20px;margin-bottom:8px;font-family:Microsoft JhengHei">' + title + '</div>' + el.outerHTML;
  document.body.appendChild(box);
  html2canvas(box, { scale: 2, backgroundColor: '#ffffff' }).then(function (canvas) {
    document.body.removeChild(box);
    var a = document.createElement('a');
    a.download = title + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }).catch(function () {
    document.body.removeChild(box);
    alert('產圖失敗，請重新整理後再試');
  });
}
</script>
</body>
</html>
