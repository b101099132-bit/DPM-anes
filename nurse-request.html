<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>護理師要班要休 | 耕莘醫院麻醉部</title>
<style>
  body { font-family: "Microsoft JhengHei", system-ui, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.2rem; color: #1a3c5e; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.06); padding: 18px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 1rem; color: #1a5e9e; margin: 0 0 12px; border-left: 4px solid #1a5e9e; padding-left: 8px; }
  select, input[type=password], input[type=month] { padding: 8px; border: 1px solid #bcd; border-radius: 6px; font-size: 1rem; }
  button { padding: 10px 18px; font-size: 1rem; border: 0; border-radius: 8px; background: #1a5e9e; color: #fff; cursor: pointer; }
  button:disabled { background: #9ab; }
  button.gray { background: #7a8a99; }
  .mbtn { padding: 4px 10px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .cat { padding: 6px 12px; border-radius: 16px; border: 2px solid transparent; cursor: pointer; font-size: .85rem; color: #fff; opacity: .55; }
  .cat.sel { opacity: 1; border-color: #333; font-weight: bold; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .h { text-align: center; font-size: .8rem; color: #789; padding: 4px 0; }
  .day { border: 1px solid #dde5ee; border-radius: 6px; min-height: 52px; padding: 3px 4px; cursor: pointer; font-size: .8rem; background: #fff; user-select: none; }
  .day .n { font-weight: bold; color: #345; }
  .day .tag { display: block; margin-top: 2px; border-radius: 4px; color: #fff; text-align: center; font-size: .72rem; padding: 1px 0; }
  .day .oth { display: block; font-size: .62rem; color: #96a5b5; line-height: 1.25; margin-top: 1px; }
  .day.we { background: #f7fafd; }
  .day.blank { visibility: hidden; }
  textarea { width: 100%; box-sizing: border-box; border: 1px solid #bcd; border-radius: 6px; padding: 8px; font-size: .95rem; font-family: inherit; }
  .ok { color: #0a7a2f; font-weight: bold; } .err { color: #c0392b; font-weight: bold; }
  .hint { color: #789; font-size: .8rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>耕莘醫院麻醉部｜護理師要班要休</h1>
  <div class="card">
    <h2>身分確認</h2>
    <div class="row">
      <select id="sel"><option>載入中…</option></select>
      <input type="password" id="pin" placeholder="個人碼" autocomplete="off" style="width:110px">
      <button type="button" class="gray mbtn" onclick="shiftMonth(-1)">◀</button>
      <input type="month" id="month">
      <button type="button" class="gray mbtn" onclick="shiftMonth(1)">▶</button>
      <button onclick="loadMine()">登入載入</button>
    </div>
    <div id="loginMsg" class="hint"></div>
    <details style="margin-top:8px"><summary class="hint" style="cursor:pointer">修改個人碼</summary>
      <div class="row">
        <input type="password" id="np1" placeholder="新個人碼" autocomplete="new-password" style="width:110px">
        <input type="password" id="np2" placeholder="再輸入一次" autocomplete="new-password" style="width:110px">
        <button type="button" class="gray" onclick="changePin()">修改</button>
      </div>
      <div class="hint">先在上方選姓名、輸入「目前的個人碼」，再填新個人碼（4～8 位數字）。忘記個人碼請找護理長重設。</div>
      <div id="pinMsg" class="hint"></div>
    </details>
  </div>

  <div id="editArea" style="display:none">
    <div class="card">
      <h2><span id="who"></span>：選類別後在月曆點日期（再點一次取消）</h2>
      <div class="cats" id="cats"></div>
      <div class="cal" id="cal"></div>
      <div class="hint" style="margin-top:8px">休假／長假：該日排休。加班許願：希望排加班線（A、B、8半）的日子，會盡量配合，衝突時抽籤決定。<br>
        月曆灰色小字為其他同仁已要的假（休＝休假、長＝長假）。</div>
    </div>
    <div class="card">
      <h2>備註（其他需求）</h2>
      <textarea id="note" rows="2"></textarea>
    </div>
    <div class="card">
      <button id="btn" onclick="submitReq()">送出</button>
      <div id="result" style="margin-top:10px"></div>
    </div>
  </div>
</div>
<script src="config.js?v=7"></script>
<script src="common.js?v=7"></script>
<script>
var CATS = [
  { key: '休假', color: '#8e44ad', short: '休' },
  { key: '長假', color: '#c0392b', short: '長假' },
  { key: '加班許願', color: '#16a085', short: '加班' }
];
var cur = 0, dayCat = {}, DIM = 0, CY = 0, CM = 0, OTH = {};

(function init() {
  jsonp({ action: 'nurseList' }, function (res) {
    var s = document.getElementById('sel');
    if (!res || !res.ok) { s.innerHTML = '<option>' + ((res && res.error) || '載入失敗') + '</option>'; return; }
    s.innerHTML = res.nurses.map(function (n) { return '<option>' + n.name + '</option>'; }).join('');
    try { var last = localStorage.getItem('nurseName'); if (last) s.value = last; } catch (e) {}
  });
  var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + 1);
  document.getElementById('month').value = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  document.getElementById('cats').innerHTML = CATS.map(function (c, i) {
    return '<span class="cat' + (i === 0 ? ' sel' : '') + '" style="background:' + c.color + '" onclick="pickCat(' + i + ')">' + c.key + '</span>';
  }).join('');
})();
function pickCat(i) { cur = i; document.querySelectorAll('.cat').forEach(function (el, j) { el.classList.toggle('sel', j === i); }); }
function rocM() { return isoToRoc(document.getElementById('month').value); }
function shiftMonth(n) {
  var el = document.getElementById('month'), p = el.value.split('-');
  var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1 + n, 1);
  var v = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  if (document.getElementById('editArea').style.display === 'block') {
    if (!confirm('切換到 ' + v.replace('-', '/') + ' 會重新載入，未送出的變更將遺失，確定？')) return;
    el.value = v; loadMine();
  } else el.value = v;
}
function days(s) { return String(s || '').split(/[,，]/).map(function (x) { return parseInt(x, 10); }).filter(function (n) { return n >= 1 && n <= 31; }); }

function loadMine() {
  var name = document.getElementById('sel').value, pin = document.getElementById('pin').value.trim();
  var msg = document.getElementById('loginMsg');
  if (!pin) { msg.innerHTML = '<span class="err">請輸入個人碼</span>'; return; }
  msg.textContent = '載入中…';
  jsonp({ action: 'nurseMyReq', name: name, pin: pin, month: rocM() }, function (res) {
    if (!res || !res.ok) { msg.innerHTML = '<span class="err">' + ((res && res.error) || '載入失敗') + '</span>'; return; }
    try { localStorage.setItem('nurseName', name); } catch (e) {}
    msg.innerHTML = '<span class="ok">身分確認成功</span>';
    document.getElementById('editArea').style.display = 'block';
    document.getElementById('who').textContent = name + '｜' + rocM();
    dayCat = {}; document.getElementById('note').value = '';
    if (res.row) {
      CATS.forEach(function (c) { days(res.row[res.headers.indexOf(c.key)]).forEach(function (d) { dayCat[d] = c.key; }); });
      document.getElementById('note').value = res.row[res.headers.indexOf('備註')] || '';
    }
    OTH = {};
    (res.others || []).forEach(function (o) {
      var ab = o.name.slice(-2);
      days(o.off).forEach(function (d) { (OTH[d] = OTH[d] || []).push('休' + ab); });
      days(o.long).forEach(function (d) { (OTH[d] = OTH[d] || []).push('長' + ab); });
    });
    buildCal();
  });
}
function buildCal() {
  var p = document.getElementById('month').value.split('-');
  CY = parseInt(p[0], 10); CM = parseInt(p[1], 10); DIM = new Date(CY, CM, 0).getDate();
  var first = new Date(CY, CM - 1, 1).getDay();
  var h = '日一二三四五六'.split('').map(function (w) { return '<div class="h">' + w + '</div>'; }).join('');
  for (var b = 0; b < first; b++) h += '<div class="day blank"></div>';
  for (var d = 1; d <= DIM; d++) {
    var w = new Date(CY, CM - 1, d).getDay();
    h += '<div class="day' + (w === 0 || w === 6 ? ' we' : '') + '" onclick="tap(' + d + ')"><span class="n">' + d + '</span><span class="tag" id="t' + d + '"></span>' +
      '<span class="oth">' + (OTH[d] || []).join(' ') + '</span></div>';
  }
  document.getElementById('cal').innerHTML = h;
  for (var i = 1; i <= DIM; i++) paint(i);
}
function tap(d) {
  var k = CATS[cur].key;
  if (k === '加班許願') { var w = new Date(CY, CM - 1, d).getDay(); if (w === 0 || w === 6) { alert('加班線只排平日'); return; } }
  if (dayCat[d] === k) delete dayCat[d]; else dayCat[d] = k;
  paint(d);
}
function paint(d) {
  var t = document.getElementById('t' + d); if (!t) return;
  var c = CATS.filter(function (x) { return x.key === dayCat[d]; })[0];
  t.textContent = c ? c.short : ''; t.style.background = c ? c.color : '';
}
function changePin() {
  var name = document.getElementById('sel').value, pin = document.getElementById('pin').value.trim();
  var a = document.getElementById('np1').value.trim(), b = document.getElementById('np2').value.trim();
  var msg = document.getElementById('pinMsg');
  if (!pin) { msg.innerHTML = '<span class="err">請先在上方輸入目前的個人碼</span>'; return; }
  if (!/^\d{4,8}$/.test(a)) { msg.innerHTML = '<span class="err">新個人碼需為 4～8 位數字</span>'; return; }
  if (a !== b) { msg.innerHTML = '<span class="err">兩次輸入不一致</span>'; return; }
  if (a === pin) { msg.innerHTML = '<span class="err">新舊個人碼相同</span>'; return; }
  msg.textContent = '修改中…';
  fetch(API_URL, { method: 'POST', mode: 'no-cors', body: new URLSearchParams({ action: 'nurseChangePin', name: name, pin: pin, newPin: a }) });
  setTimeout(function () {   // 用新個人碼回讀驗證
    jsonp({ action: 'nurseMyReq', name: name, pin: a, month: rocM() }, function (res) {
      if (res && res.ok) {
        document.getElementById('pin').value = a;
        document.getElementById('np1').value = document.getElementById('np2').value = '';
        msg.innerHTML = '<span class="ok">✓ 個人碼已更新，下次請用新個人碼登入</span>';
      } else {
        msg.innerHTML = '<span class="err">修改未成功：可能目前個人碼錯誤，或新個人碼已有人使用</span>';
      }
    });
  }, 3000);
}

function submitReq() {
  var name = document.getElementById('sel').value, pin = document.getElementById('pin').value.trim();
  var data = { '備註': document.getElementById('note').value.trim() };
  CATS.forEach(function (c) {
    var a = []; for (var d = 1; d <= DIM; d++) if (dayCat[d] === c.key) a.push(d);
    data[c.key] = a.join(',');
  });
  var btn = document.getElementById('btn'), out = document.getElementById('result');
  btn.disabled = true; out.textContent = '送出中…';
  fetch(API_URL, { method: 'POST', mode: 'no-cors', body: new URLSearchParams({ action: 'nurseSaveRequest', name: name, pin: pin, month: rocM(), data: JSON.stringify(data) }) });
  setTimeout(function () {
    jsonp({ action: 'nurseMyReq', name: name, pin: pin, month: rocM() }, function (res) {
      btn.disabled = false;
      var ok = res && res.ok && res.row && String(res.row[res.headers.indexOf('休假')] || '') === data['休假'] &&
        String(res.row[res.headers.indexOf('加班許願')] || '') === data['加班許願'];
      out.innerHTML = ok ? '<span class="ok">✓ ' + rocM() + ' 需求已送出，排班時會納入考量</span>' : '<span class="err">回讀驗證未通過，請再送出一次</span>';
    });
  }, 3000);
}
</script>
</body>
</html>
