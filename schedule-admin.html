<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>排班工作台 | 耕莘醫院麻醉部</title>
<style>
  body { font-family: "Microsoft JhengHei", system-ui, sans-serif; background: #f0f4f8; margin: 0; padding: 16px; }
  .wrap { max-width: 1250px; margin: 0 auto; }
  h1 { font-size: 1.25rem; color: #1a3c5e; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.06); padding: 16px 18px; margin-bottom: 14px; }
  .card h2 { font-size: 1rem; color: #1a5e9e; margin: 0 0 10px; border-left: 4px solid #1a5e9e; padding-left: 8px; }
  select, input { padding: 7px; border: 1px solid #bcd; border-radius: 6px; font-size: .95rem; }
  button { padding: 9px 16px; font-size: .95rem; border: 0; border-radius: 7px; background: #1a5e9e; color: #fff; cursor: pointer; margin: 2px; }
  button.warn { background: #b34700; }
  button.gray { background: #7a8a99; }
  button:disabled { background: #9ab; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .grid-scroll { overflow-x: auto; }
  table.sched { border-collapse: collapse; font-size: .78rem; white-space: nowrap; }
  table.sched th, table.sched td { border: 1px solid #cbd6e2; padding: 2px 3px; text-align: center; min-width: 34px; }
  table.sched th { background: #eef4fa; color: #1a3c5e; }
  table.sched td.doc { font-weight: bold; background: #f7fafd; min-width: 64px; }
  table.sched td.cell { cursor: pointer; height: 26px; }
  table.sched th.we { background: #ffe9d6; }
  table.sched td.viol { outline: 2px solid #e74c3c; outline-offset: -2px; }
  table.sched td.prev { background: #f0f0f0; color: #999; }
  .s-白班 { background: #d6e6f7; } .s-值班 { background: #f5c6c2; } .s-鏡檢 { background: #c9ede4; }
  .s-安康 { background: #d5f0d0; } .s-聖母 { background: #e2e2e2; } .s-二線班 { background: #e3d6f2; }
  .s-OFF { background: #fafafa; color: #aaa; } .s-休 { background: #efe0f5; color: #8e44ad; }
  .pal { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .pal span { padding: 5px 12px; border-radius: 14px; border: 2px solid transparent; cursor: pointer; font-size: .85rem; }
  .pal span.sel { border-color: #333; font-weight: bold; }
  table.mini { border-collapse: collapse; font-size: .82rem; }
  table.mini th, table.mini td { border: 1px solid #dde5ee; padding: 3px 8px; text-align: right; }
  table.mini th { background: #eef4fa; }
  table.mini td:first-child { text-align: center; font-weight: bold; }
  .viol-list { color: #c0392b; font-size: .85rem; white-space: pre-wrap; max-height: 180px; overflow-y: auto; }
  .ok { color: #0a7a2f; font-weight: bold; } .err { color: #c0392b; font-weight: bold; }
  .hint { color: #789; font-size: .8rem; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: .8rem; color: #fff; }
  .b-pub { background: #0a7a2f; } .b-draft { background: #7a8a99; } .b-pending { background: #e67e22; }
  #reqTable td, #logTable td { text-align: left; }
  td.nil { background: #a6a6a6; color: #fff; font-weight: bold; }
  #picker { position: absolute; background: #fff; border: 1px solid #789; border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,.2); padding: 6px; z-index: 99; display: none; }
  #picker span { display: inline-block; padding: 5px 10px; margin: 2px; border-radius: 6px;
    background: #eef4fa; cursor: pointer; font-size: .85rem; }
  #picker span:hover { background: #d6e6f7; }
  #picker span.bad { color: #bbb; text-decoration: line-through; }
  #picker span.nilopt { background: #a6a6a6; color: #fff; }
  #picker span.clropt { background: #f5c6c2; }
</style>
</head>
<body>
<div class="wrap">
  <h1>排班工作台 <span id="whoBadge" class="hint"></span></h1>

  <div class="card" id="loginCard">
    <h2>登入（排班者個人碼 或 管理員通行碼）</h2>
    <div class="row">
      <select id="docSel"><option>載入中…</option></select>
      <input type="password" id="pin" placeholder="個人碼" style="width:100px">
      <span class="hint">或</span>
      <input type="password" id="adminPass" placeholder="管理員通行碼" style="width:140px">
      <input type="month" id="month">
      <button onclick="login()">登入</button>
    </div>
    <div id="loginMsg" class="hint"></div>
  </div>

  <div id="work" style="display:none">
    <div class="card">
      <h2>月設定 <span id="pubBadge"></span></h2>
      <div class="row"><label style="width:150px">國定假日（日,逗號）</label><input id="cfg_holiday" style="width:280px"></div>
      <div class="row"><label style="width:150px">部長開會日（李代二線）</label><input id="cfg_meet" style="width:280px"></div>
      <div class="row"><label style="width:150px">聖母不排週（週一日期）</label><input id="cfg_nost" style="width:280px"></div>
      <div class="row"><label style="width:150px">二線不排日（三/五）</label><input id="cfg_no2" style="width:280px"></div>
      <div class="row"><label style="width:150px">值後可接安康日</label><input id="cfg_exAk" style="width:280px"></div>
      <div class="row"><label style="width:150px">值後可接白/鏡日</label><input id="cfg_exWh" style="width:280px"></div>
      <button class="gray" onclick="saveSettings()">儲存月設定</button>
      <span id="cfgMsg" class="hint"></span>
    </div>

    <div class="card">
      <h2>要班需求彙總</h2>
      <div class="grid-scroll"><table class="mini" id="reqTable"></table></div>
      <h2 style="margin-top:12px">需求填報紀錄（每次送出留存，可比對先後）</h2>
      <div class="grid-scroll" style="max-height:180px;overflow-y:auto"><table class="mini" id="logTable"></table></div>
    </div>

    <div class="card">
      <h2>班表編輯（先點班別，再點格子；再點一次清除）</h2>
      <div class="pal" id="pal"></div>
      <div class="row">
        <button onclick="genDraft()">自動產生草稿</button>
        <button class="gray" onclick="runValidate()">檢核違規</button>
        <button class="gray" onclick="clearGrid()">清空班表</button>
        <button onclick="saveDraft(null)">儲存草稿</button>
        <button class="warn" id="btnSubmit" onclick="saveDraft('submit')">儲存並送審</button>
        <button class="warn" id="btnPublish" onclick="saveDraft('publish')" style="display:none">儲存並發布</button>
        <button class="gray" id="btnUnpub" onclick="unpublish()">退回草稿</button>
      </div>
      <div class="grid-scroll"><table class="sched" id="grid"></table></div>
      <div class="hint">灰色前兩欄為上月末班別（自動帶入，供銜接檢核）。二線班預設為鄒部長，僅部長開會日需在表中排李主任二線班。</div>
      <h2 style="margin-top:14px">班別視角編輯（點格子選醫師／NIL／清除，與上表即時連動）</h2>
      <div class="grid-scroll"><table class="sched" id="sgrid"></table></div>
      <div class="hint">NIL＝確認排不出人（灰底），與空白（還沒排）區隔；檢核不會把 NIL 當缺班。</div>
      <div id="saveMsg" style="margin-top:6px"></div>
    </div>
    <div id="picker"></div>

    <div class="card">
      <h2>檢核結果</h2>
      <div class="viol-list" id="violList">尚未檢核</div>
    </div>

    <div class="card">
      <h2>統計</h2>
      <div class="grid-scroll"><table class="mini" id="statTable"></table></div>
    </div>

    <div class="card">
      <h2>Word 下載（給秘書上傳院內網）</h2>
      <button onclick="dlHospitalDoc()">醫院格式（醫療作業表）</button>
      <button onclick="dlAnkangDoc()">安康值班表</button>
      <div class="hint">下載為 .doc（Word 可直接開啟編輯／另存 .docx）。</div>
    </div>
  </div>
</div>

<script src="config.js?v=6"></script>
<script src="common.js?v=6"></script>
<script>
var SHIFTS = ['白班', '值班', '鏡檢', '安康', '聖母', '二線班', 'OFF', '休'];
var POINTS = { '值班': 3, '白班': 1, '鏡檢': 1, '二線班': 1, '聖母': 0, '安康': 0 };
var EXCLUDE_GRID = ['鄒美勇']; // 部長固定二線，不入班表格
var WB = null, GRID = {}, DIM = 0, Y = 0, M = 0, curShift = 0, VIOL = {};
var NILS = {}; // {'20_聖母': true} 確認排不出人的班別

init();

function init() {
  jsonp({ action: 'doctorList' }, function (res) {
    var sel = document.getElementById('docSel');
    sel.innerHTML = (res && res.ok)
      ? res.doctors.map(function (d) { return '<option value="' + d.name + '">' + d.name + '</option>'; }).join('')
      : '<option>載入失敗</option>';
  });
  var d = new Date();
  d.setDate(1); d.setMonth(d.getMonth() + 1);
  document.getElementById('month').value = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  var hash = getPasscode();
  if (hash) document.getElementById('adminPass').value = hash;
  var html = '';
  SHIFTS.forEach(function (s, i) {
    html += '<span class="s-' + s + (i === 0 ? ' sel' : '') + '" onclick="pickShift(' + i + ')">' + s + '</span>';
  });
  document.getElementById('pal').innerHTML = html;
}

function pickShift(i) {
  curShift = i;
  document.querySelectorAll('.pal span').forEach(function (el, j) { el.classList.toggle('sel', j === i); });
}

function authParams() {
  var ap = document.getElementById('adminPass').value.trim();
  if (ap) return { passcode: ap };
  return { name: document.getElementById('docSel').value, pin: document.getElementById('pin').value.trim() };
}
function rocM() { return isoToRoc(document.getElementById('month').value); }

function login() {
  var p = authParams();
  p.action = 'workbench'; p.month = rocM();
  document.getElementById('loginMsg').textContent = '載入中…';
  jsonp(p, function (res) {
    if (!res || !res.ok) {
      document.getElementById('loginMsg').innerHTML = '<span class="err">' + ((res && res.error) || '登入失敗') + '</span>';
      return;
    }
    WB = res;
    var iso = document.getElementById('month').value.split('-');
    Y = parseInt(iso[0], 10); M = parseInt(iso[1], 10);
    DIM = new Date(Y, M, 0).getDate();
    document.getElementById('loginMsg').textContent = '';
    document.getElementById('work').style.display = 'block';
    document.getElementById('whoBadge').textContent = '｜' + res.who + '｜' + rocM();
    document.getElementById('btnPublish').style.display = res.isAdmin ? '' : 'none';
    document.getElementById('btnSubmit').style.display = res.isAdmin ? 'none' : '';
    loadCfgToForm();
    renderRequests();
    renderLogs();
    GRID = {};
    gridDoctors().forEach(function (d) {
      GRID[d.name] = (res.roster[d.name] || Array.from({ length: 31 }, function () { return ''; })).slice(0, 31);
    });
    prefillLeaves();
    renderGrid(); renderStats();
  });
}

function gridDoctors() {
  return WB.doctors.filter(function (d) { return EXCLUDE_GRID.indexOf(d.name) < 0; });
}
function reqOf(name) {
  var r = WB.requests.filter(function (x) { return String(x[1]) === name; })[0];
  if (!r) return null;
  var o = {};
  WB.reqHeaders.forEach(function (h, i) { o[h] = r[i]; });
  return o;
}
function parseDays(v) {
  return String(v == null ? '' : v).split(/[,，]/).map(function (s) { return parseInt(s, 10); })
    .filter(function (n) { return n >= 1 && n <= 31; });
}
function cfgVal(h) {
  if (!WB.cfg) return '';
  return String(WB.cfg[WB.cfgHeaders.indexOf(h)] || '');
}
function loadCfgToForm() {
  document.getElementById('cfg_holiday').value = cfgVal('國定假日');
  document.getElementById('cfg_meet').value = cfgVal('部長開會日');
  document.getElementById('cfg_nost').value = cfgVal('聖母不排週');
  document.getElementById('cfg_no2').value = cfgVal('二線不排日');
  document.getElementById('cfg_exAk').value = cfgVal('值後可安康日');
  document.getElementById('cfg_exWh').value = cfgVal('值後可白鏡日');
  var st = cfgVal('狀態') || '草稿';
  var cls = st === '發布' ? 'b-pub' : (st === '待確認' ? 'b-pending' : 'b-draft');
  document.getElementById('pubBadge').innerHTML = '<span class="badge ' + cls + '">' +
    (st === '發布' ? '已發布' : st === '待確認' ? '待管理員確認' : '草稿') + '</span>';
  // NIL 標記解析（格式：20=聖母,5=值班）
  NILS = {};
  String(cfgVal('NIL標記') || '').split(/[,，]/).forEach(function (s) {
    var m = s.trim().split('=');
    if (m.length === 2 && parseInt(m[0], 10) >= 1) NILS[parseInt(m[0], 10) + '_' + m[1].trim()] = true;
  });
}
function serializeNils() {
  return Object.keys(NILS).map(function (k) {
    var p = k.split('_');
    return p[0] + '=' + p[1];
  }).join(',');
}
function isNil(d, s) { return !!NILS[d + '_' + s]; }
function cfgSets() {
  return {
    holiday: parseDays(document.getElementById('cfg_holiday').value),
    meet: parseDays(document.getElementById('cfg_meet').value),
    nost: parseDays(document.getElementById('cfg_nost').value),
    no2: parseDays(document.getElementById('cfg_no2').value),
    exAk: parseDays(document.getElementById('cfg_exAk').value),
    exWh: parseDays(document.getElementById('cfg_exWh').value)
  };
}

function fmtTime(v) {
  if (!v) return '';
  var d = new Date(v);
  if (isNaN(d)) return String(v);
  return ('0' + (d.getMonth() + 1)).slice(-2) + '/' + ('0' + d.getDate()).slice(-2) + ' ' +
    ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}

function renderRequests() {
  var html = '<tr><th>醫師</th><th>休假</th><th>聖母</th><th>備註</th><th>最後填報時間</th></tr>';
  WB.doctors.forEach(function (d) {
    var r = reqOf(d.name);
    html += '<tr><td>' + d.name + '</td>' +
      ['休假', '羅東聖母', '備註'].map(function (h) {
        return '<td>' + (r ? String(r[h] || '') : '') + '</td>';
      }).join('') + '<td>' + (r ? fmtTime(r['填報時間']) : '') + '</td></tr>';
  });
  document.getElementById('reqTable').innerHTML = html;
}

function renderLogs() {
  var logs = (WB.reqLogs || []).slice().sort(function (a, b) {
    return String(a[0]) < String(b[0]) ? 1 : -1; // 新→舊
  });
  var html = '<tr><th>送出時間</th><th>醫師</th><th>休假</th><th>聖母</th><th>備註</th></tr>';
  logs.forEach(function (r) {
    html += '<tr><td>' + fmtTime(r[0]) + '</td><td>' + r[2] + '</td><td>' + (r[3] || '') + '</td><td>' + (r[4] || '') + '</td><td>' + (r[5] || '') + '</td></tr>';
  });
  document.getElementById('logTable').innerHTML = html + (logs.length ? '' : '<tr><td colspan="5">本月尚無填報紀錄</td></tr>');
}

function dow(d) { return new Date(Y, M - 1, d).getDay(); } // 0=日
var DOWTXT = ['日', '一', '二', '三', '四', '五', '六'];

function prevDim() {
  var y = Y, m = M - 1;
  if (m < 1) { m = 12; y -= 1; }
  return new Date(y, m, 0).getDate();
}
function prevCell(name, back) { // back=1 上月最後一天, 2 倒數第二天
  var r = WB.prevRoster[name];
  if (!r) return '';
  return String(r[prevDim() - back] || '');
}

function prefillLeaves() {
  gridDoctors().forEach(function (d) {
    var r = reqOf(d.name);
    if (!r) return;
    parseDays(r['休假']).forEach(function (day) {
      if (day <= DIM && !GRID[d.name][day - 1]) GRID[d.name][day - 1] = '休';
    });
  });
}

function renderGrid() {
  var docs = gridDoctors();
  var html = '<tr><th>醫師</th><th class="we">' + (prevDim() - 1) + '</th><th class="we">' + prevDim() + '</th>';
  for (var d = 1; d <= DIM; d++) {
    var w = dow(d);
    html += '<th' + (w === 0 || w === 6 ? ' class="we"' : '') + '>' + d + '<br>' + DOWTXT[w] + '</th>';
  }
  html += '</tr>';
  docs.forEach(function (doc) {
    html += '<tr><td class="doc">' + doc.name + '</td>';
    html += '<td class="prev">' + prevCell(doc.name, 2) + '</td><td class="prev">' + prevCell(doc.name, 1) + '</td>';
    for (var d = 1; d <= DIM; d++) {
      var v = GRID[doc.name][d - 1] || '';
      var cls = 'cell' + (v ? ' s-' + v : '') + (VIOL[doc.name + '_' + d] ? ' viol' : '');
      html += '<td class="' + cls + '" onclick="tapCell(\'' + doc.name + '\',' + d + ')" title="' + (VIOL[doc.name + '_' + d] || '') + '">' + v + '</td>';
    }
    html += '</tr>';
  });
  // 已排/應排
  var c = cfgSets();
  html += '<tr><td class="doc">已排/應排</td><td class="prev"></td><td class="prev"></td>';
  for (var d2 = 1; d2 <= DIM; d2++) {
    var got = 0;
    docs.forEach(function (doc) { var v = GRID[doc.name][d2 - 1]; if (v && v !== 'OFF' && v !== '休') got++; });
    var need = requiredShifts(d2, c).filter(function (s) { return !isNil(d2, s); }).length;
    html += '<td style="' + (got !== need ? 'color:#c0392b;font-weight:bold' : 'color:#0a7a2f') + '">' + got + '/' + need + '</td>';
  }
  html += '</tr>';
  document.getElementById('grid').innerHTML = html;
  renderShiftGrid();
}

// ===== 班別視角矩陣（與 GRID 同資料連動）=====
var SGRID_SHIFTS = ['值班', '白班', '鏡檢', '安康', '聖母', '二線班'];
function renderShiftGrid() {
  var docs = gridDoctors();
  var html = '<tr><th>班別</th>';
  for (var d = 1; d <= DIM; d++) {
    var w = dow(d);
    html += '<th' + (w === 0 || w === 6 ? ' class="we"' : '') + '>' + d + '<br>' + DOWTXT[w] + '</th>';
  }
  html += '</tr>';
  SGRID_SHIFTS.forEach(function (s) {
    html += '<tr><td class="doc">' + s + '</td>';
    for (var d = 1; d <= DIM; d++) {
      var whos = docs.filter(function (doc) { return GRID[doc.name][d - 1] === s; })
        .map(function (doc) { return abbrOf(doc.name); });
      var nil = isNil(d, s);
      var content = nil ? 'NIL' : whos.join('/');
      var cls = 'cell' + (nil ? ' nil' : (whos.length ? ' s-' + s : ''));
      html += '<td class="' + cls + '" onclick="openPicker(event,\'' + s + '\',' + d + ')">' + content + '</td>';
    }
    html += '</tr>';
  });
  document.getElementById('sgrid').innerHTML = html;
}

function openPicker(ev, shift, d) {
  var c = cfgSets();
  var pk = document.getElementById('picker');
  var docs = gridDoctors();
  var html = '<div style="font-size:.8rem;color:#345;margin:2px 4px"><b>' + d + '日 ' + DOWTXT[dow(d)] + '｜' + shift + '</b></div>';
  docs.forEach(function (doc) {
    var cur = GRID[doc.name][d - 1];
    var ok = eligible(doc.name, d, shift, c) || cur === shift;
    html += '<span class="' + (ok ? '' : 'bad') + '" onclick="pickAssign(\'' + shift + '\',' + d + ',\'' + doc.name + '\')">' +
      abbrOf(doc.name) + (cur && cur !== shift ? '(' + cur + ')' : '') + '</span>';
  });
  html += '<br><span class="nilopt" onclick="pickAssign(\'' + shift + '\',' + d + ',\'__NIL__\')">NIL 排不出人</span>';
  html += '<span class="clropt" onclick="pickAssign(\'' + shift + '\',' + d + ',\'__CLR__\')">清除</span>';
  pk.innerHTML = html;
  pk.style.display = 'block';
  pk.style.left = Math.min(ev.pageX, window.innerWidth - 260) + 'px';
  pk.style.top = (ev.pageY + 8) + 'px';
  ev.stopPropagation();
}
document.addEventListener('click', function () {
  var pk = document.getElementById('picker');
  if (pk) pk.style.display = 'none';
});

function pickAssign(shift, d, who) {
  // 先清掉該班別當天原本的人
  gridDoctors().forEach(function (doc) {
    if (GRID[doc.name][d - 1] === shift) GRID[doc.name][d - 1] = '';
  });
  delete NILS[d + '_' + shift];
  if (who === '__NIL__') {
    NILS[d + '_' + shift] = true;
  } else if (who !== '__CLR__') {
    GRID[who][d - 1] = shift; // 覆蓋該醫師當天原值
  }
  document.getElementById('picker').style.display = 'none';
  runValidate();
}

function tapCell(name, d) {
  var s = SHIFTS[curShift];
  GRID[name][d - 1] = (GRID[name][d - 1] === s) ? '' : s;
  runValidate();
}

function clearGrid() {
  gridDoctors().forEach(function (d) { GRID[d.name] = Array.from({ length: 31 }, function () { return ''; }); });
  prefillLeaves(); VIOL = {}; renderGrid(); renderStats();
}

// ===== 每日應排班別 =====
function requiredShifts(d, c) {
  var w = dow(d);
  var isHol = c.holiday.indexOf(d) >= 0;
  var out = ['值班', '安康'];
  var monOfWeek = d - ((w + 6) % 7); // 該週週一日期
  var stWeek = (w === 1 || w === 2) && c.nost.indexOf(w === 1 ? d : d - 1) < 0;
  if (isHol) {
    if (stWeek) out.push('聖母');
    return out;
  }
  if (w === 0 || w === 6) return out;
  out.push('白班', '鏡檢');
  if (stWeek) out.push('聖母');
  if ((w === 3 || w === 5) && c.no2.indexOf(d) < 0 && c.meet.indexOf(d) >= 0) out.push('二線班');
  return out;
}

// ===== 資格判斷 =====
function eligible(name, d, s, c) {
  var abbr = abbrOf(name);
  var cur = GRID[name][d - 1];
  if (cur && cur !== s) return false;
  if (s === '值班' && (abbr === '李' || abbr === '劉')) return false;
  if (s === '聖母' && ['李', '王', '昀', '劉'].indexOf(abbr) >= 0) return false;
  if ((s === '白班' || s === '二線班') && abbr === '劉') return false;
  if (abbr === '劉') {
    if (['鏡檢', '安康'].indexOf(s) < 0) return false;
    var mir = 0, tot = 0;
    GRID[name].forEach(function (v) { if (v === '鏡檢') mir++; if (v && v !== 'OFF' && v !== '休') tot++; });
    if (s === '鏡檢' && mir >= 3) return false;
    if (tot >= 15) return false; // 劉合計上限 15
  }
  var yv = (d === 1) ? prevCell(name, 1) : (GRID[name][d - 2] || '');
  if (yv === '值班') {
    var yd = d - 1;
    var okAk = s === '安康' && (d > 1 ? c.exAk.indexOf(yd) >= 0 : false);
    var okWh = (s === '白班' || s === '鏡檢') && (d > 1 ? c.exWh.indexOf(yd) >= 0 : false);
    if (!okAk && !okWh) return false;
  }
  if (yv === '聖母' && dow(d) === 3) return false; // 聖母後隔天週三不排
  return true;
}
function abbrOf(name) {
  var d = WB.doctors.filter(function (x) { return x.name === name; })[0];
  return d ? d.abbr : name;
}
function pointsOf(name) {
  var p = 0;
  GRID[name].forEach(function (v) { p += POINTS[v] || 0; });
  return p;
}

// ===== 自動排班引擎：多次隨機重排取最佳 =====
function genDraft() {
  var c = cfgSets();
  var best = null, bestScore = Infinity;
  for (var t = 0; t < 40; t++) {
    var g = tryOnce(c);
    var sc = scoreGrid(g, c);
    if (sc < bestScore) { bestScore = sc; best = g; }
  }
  GRID = best;
  runValidate();
  document.getElementById('saveMsg').innerHTML = '<span class="ok">草稿已產生（可手動微調後儲存）</span>';
}

function tryOnce(c) {
  var docs = gridDoctors().map(function (d) { return d.name; });
  var g = {};
  docs.forEach(function (n) { g[n] = Array.from({ length: 31 }, function () { return ''; }); });
  var saveG = GRID; GRID = g; // eligible/points 引用 GRID
  // 1. 休假
  docs.forEach(function (n) {
    var r = reqOf(n);
    if (r) parseDays(r['休假']).forEach(function (d) { if (d <= DIM) g[n][d - 1] = '休'; });
  });
  // 2. 要班（指定）
  var wants = { '值班': {}, '鏡檢': {}, '安康': {}, '聖母': {} };
  docs.forEach(function (n) {
    var r = reqOf(n);
    if (!r) return;
    parseDays(r['胃鏡']).forEach(function (d) { (wants['鏡檢'][d] = wants['鏡檢'][d] || []).push(n); });
    parseDays(r['耕莘值班假日']).concat(parseDays(r['耕莘值班平日'])).forEach(function (d) { (wants['值班'][d] = wants['值班'][d] || []).push(n); });
    parseDays(r['安康']).forEach(function (d) { (wants['安康'][d] = wants['安康'][d] || []).push(n); });
    parseDays(r['羅東聖母']).forEach(function (d) { (wants['聖母'][d] = wants['聖母'][d] || []).push(n); });
  });
  // 3. 部長開會日 → 李二線
  c.meet.forEach(function (d) {
    if (d <= DIM && !g[nameOfAbbr('李')][d - 1]) g[nameOfAbbr('李')][d - 1] = '二線班';
  });
  // 3.5 李固定週四安康（自 115/09 起慣例；休假或已指定班別的週四除外）
  var liTh = nameOfAbbr('李');
  if (g[liTh]) {
    for (var dTh = 1; dTh <= DIM; dTh++) {
      if (dow(dTh) === 4 && !g[liTh][dTh - 1]) g[liTh][dTh - 1] = '安康';
    }
  }
  // 4. 聖母週（一+二同醫師）
  for (var d = 1; d <= DIM; d++) {
    if (dow(d) !== 1) continue;
    if (c.nost.indexOf(d) >= 0) continue;
    if (isNil(d, '聖母') && isNil(d + 1, '聖母')) continue; // 兩天都標 NIL
    var tue = d + 1;
    var stWedOff = function (who, tueDay) { // 聖母後隔天週三標 OFF
      var wed = tueDay + 1;
      if (who && wed <= DIM && dow(wed) === 3 && !g[who][wed - 1]) g[who][wed - 1] = 'OFF';
    };
    var bothC = docs.filter(function (n) {
      return eligible(n, d, '聖母', c) && (tue > DIM || eligible(n, tue, '聖母', c));
    });
    var pref = (wants['聖母'][d] || []).filter(function (n) { return bothC.indexOf(n) >= 0; });
    var pick = pref.length ? pref[0] : (bothC.length ? shuffle(bothC)[0] : null);
    if (pick) {
      g[pick][d - 1] = '聖母';
      if (tue <= DIM) { g[pick][tue - 1] = '聖母'; stWedOff(pick, tue); }
    } else {
      // 無人能包兩天 → 拆成兩天不同醫師
      [d, tue].forEach(function (d2) {
        if (d2 > DIM) return;
        var c2 = docs.filter(function (n) { return eligible(n, d2, '聖母', c); });
        var p2 = (wants['聖母'][d2] || []).filter(function (n) { return c2.indexOf(n) >= 0; })[0]
          || (c2.length ? shuffle(c2)[0] : null);
        if (p2) {
          g[p2][d2 - 1] = '聖母';
          if (d2 === tue) stWedOff(p2, tue);
        }
      });
    }
  }
  // 5. 逐日排班
  for (var day = 1; day <= DIM; day++) {
    // 值班隔天 OFF
    docs.forEach(function (n) {
      var yv = (day === 1) ? prevCell(n, 1) : g[n][day - 2];
      if (yv === '值班' && !g[n][day - 1] && c.exAk.indexOf(day - 1) < 0 && c.exWh.indexOf(day - 1) < 0) {
        g[n][day - 1] = 'OFF';
      }
    });
    var todo = requiredShifts(day, c).filter(function (s) {
      return s !== '聖母' && s !== '二線班' && !isNil(day, s) &&
        !docs.some(function (n) { return g[n][day - 1] === s; });
    });
    while (todo.length) {
      // 候選人最少的班別優先排（避免稀缺人力被其他班先佔走）
      var s = null, cands = null;
      todo.forEach(function (s2) {
        var c2 = docs.filter(function (n) { return eligible(n, day, s2, c); });
        if (cands === null || c2.length < cands.length) { cands = c2; s = s2; }
      });
      todo.splice(todo.indexOf(s), 1);
      if (!cands.length) continue;
      var pref = (wants[s] && wants[s][day] || []).filter(function (n) { return cands.indexOf(n) >= 0; });
      var pick = null; // 每輪重置（避免沿用前一班別的人選）
      if (pref.length) pick = pref[0];
      else if (s === '安康') {
        var liu = nameOfAbbr('劉');
        var liuTotal = g[liu] ? g[liu].filter(function (v) { return v && v !== 'OFF' && v !== '休'; }).length : 99;
        // 劉「配速」：安康平均分布整月（目標約14班），不要前半月塞滿
        if (cands.indexOf(liu) >= 0 && liuTotal < (day / DIM) * 14 && Math.random() < 0.9) pick = liu;
        if (!pick) {
          // 安康是 0 點班 → 給點值較高者，把能得點的班（白班/鏡檢）留給低點值醫師（如李）
          var hi = shuffle(cands.filter(function (n) { return n !== liu; }));
          if (!hi.length) hi = shuffle(cands);
          hi.sort(function (a, b) { return pointsOf(b) - pointsOf(a); });
          pick = hi[0];
        }
      }
      if (!pick) {
        var sorted = shuffle(cands).sort(function (a, b) { return pointsOf(a) - pointsOf(b); });
        pick = sorted[0];
      }
      g[pick][day - 1] = s;
      if (s === '值班' && day < DIM && !g[pick][day] && c.exAk.indexOf(day) < 0 && c.exWh.indexOf(day) < 0) {
        g[pick][day] = 'OFF';
      }
    }
  }
  GRID = saveG;
  return g;
}
function nameOfAbbr(a) {
  var d = WB.doctors.filter(function (x) { return x.abbr === a; })[0];
  return d ? d.name : a;
}
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function scoreGrid(g, c) {
  var saveG = GRID; GRID = g;
  var v = collectViolations(c).length;
  var pts = gridDoctors().map(function (d) { return abbrOf(d.name) === '劉' || abbrOf(d.name) === '李' ? null : pointsOf(d.name); })
    .filter(function (x) { return x !== null; });
  var avg = pts.reduce(function (a, b) { return a + b; }, 0) / (pts.length || 1);
  var spread = pts.reduce(function (a, b) { return a + Math.abs(b - avg); }, 0);
  GRID = saveG;
  return v * 100 + spread;
}

// ===== 違規檢核 =====
function collectViolations(c) {
  var out = [];
  var docs = gridDoctors().map(function (d) { return d.name; });
  for (var d = 1; d <= DIM; d++) {
    var seen = {};
    var req = requiredShifts(d, c);
    docs.forEach(function (n) {
      var v = GRID[n][d - 1];
      if (!v || v === 'OFF' || v === '休') return;
      var abbr = abbrOf(n);
      if (seen[v]) out.push({ n: n, d: d, msg: d + '日 ' + v + ' 重複（' + seen[v] + '/' + abbr + '）' });
      seen[v] = abbr;
      if (req.indexOf(v) < 0 && v !== '二線班') out.push({ n: n, d: d, msg: d + '日不應排「' + v + '」（' + abbr + '）' });
      if (v === '值班' && (abbr === '李' || abbr === '劉')) out.push({ n: n, d: d, msg: abbr + '不可值班（' + d + '日）' });
      if (v === '聖母' && ['李', '王', '昀', '劉'].indexOf(abbr) >= 0) out.push({ n: n, d: d, msg: abbr + '不可聖母（' + d + '日）' });
      if (abbr === '劉' && ['鏡檢', '安康'].indexOf(v) < 0) out.push({ n: n, d: d, msg: '劉只能鏡檢/安康（' + d + '日排' + v + '）' });
      var yv = (d === 1) ? prevCell(n, 1) : GRID[n][d - 2];
      if (yv === '值班') {
        var okAk = v === '安康' && c.exAk.indexOf(d - 1) >= 0;
        var okWh = (v === '白班' || v === '鏡檢') && c.exWh.indexOf(d - 1) >= 0;
        if (!okAk && !okWh) out.push({ n: n, d: d, msg: abbr + ' 值班隔天不可排班（' + d + '日）' });
      }
      if (yv === '聖母' && dow(d) === 3) out.push({ n: n, d: d, msg: abbr + ' 聖母後週三不排班（' + d + '日）' });
    });
    req.forEach(function (s) {
      if (s === '二線班') return;
      if (isNil(d, s)) return; // 已標 NIL＝確認排不出，不算缺班
      if (!docs.some(function (n) { return GRID[n][d - 1] === s; })) out.push({ n: '', d: d, msg: d + '日缺「' + s + '」' });
    });
  }
  var liu = nameOfAbbr('劉');
  if (GRID[liu]) {
    var mir = GRID[liu].filter(function (v) { return v === '鏡檢'; }).length;
    var tot = GRID[liu].filter(function (v) { return v && v !== 'OFF' && v !== '休'; }).length;
    if (mir > 3) out.push({ n: liu, d: 0, msg: '劉鏡檢 ' + mir + ' 班（上限3）' });
    if (tot < 10 || tot > 15) out.push({ n: liu, d: 0, msg: '劉總班數 ' + tot + '（應10–15）' });
  }
  return out;
}

function runValidate() {
  var c = cfgSets();
  var list = collectViolations(c);
  VIOL = {};
  list.forEach(function (v) { if (v.n && v.d) VIOL[v.n + '_' + v.d] = v.msg; });
  document.getElementById('violList').innerHTML = list.length
    ? list.map(function (v) { return '✗ ' + v.msg; }).join('\n')
    : '<span class="ok">✓ 無違規</span>';
  renderGrid(); renderStats();
}

function renderStats() {
  var docs = gridDoctors();
  var cols = ['值班', '白班', '鏡檢', '二線班', '安康', '聖母', '休', '總班數'];
  var html = '<tr><th>醫師</th>' + cols.map(function (s) { return '<th>' + s + '</th>'; }).join('') +
    (WB.isAdmin ? '<th>總點值</th>' : '') + '</tr>';
  docs.forEach(function (d) {
    var cnt = {};
    GRID[d.name].forEach(function (v) { if (v) cnt[v] = (cnt[v] || 0) + 1; });
    var tot = GRID[d.name].filter(function (v) { return v && v !== 'OFF' && v !== '休'; }).length;
    html += '<tr><td>' + d.name + '</td>' + cols.map(function (s) {
      return '<td>' + (s === '總班數' ? tot : (cnt[s] || 0)) + '</td>';
    }).join('') + (WB.isAdmin ? '<td><b>' + pointsOf(d.name) + '</b></td>' : '') + '</tr>';
  });
  document.getElementById('statTable').innerHTML = html;
}

  h += '<h2>五、注意事項：</h2><p>各醫療科總醫師或書記於每月28日前(若遇週六或假日則提前1-2日)，將該科次月「各科部醫師醫療作業表」電子檔案送交教研部。</p>';
  docBlob('醫療作業表', h, ym.y + '-' + ('0' + ym.m).slice(-2) + '醫院格式.doc');
}

function dlAnkangDoc() {
  var ym = rocYM();
  var h = '<h1>' + ym.y + '年' + ('0' + ym.m).slice(-2) + '月份麻醉科主治醫師值班表</h1>';
  h += '<table><tr>' + ['一', '二', '三', '四', '五', '六', '日'].map(function (w) { return '<th>' + w + '</th>'; }).join('') + '</tr>';
  var firstDow = (dow(1) + 6) % 7; // 0=一
  var day = 1;
  while (day <= DIM) {
    var nums = '', names = '';
    for (var col = 0; col < 7; col++) {
      var show = (day === 1 && col < firstDow) || day > DIM ? '' : day;
      if (show !== '') {
        nums += '<td>' + show + '</td>';
        names += '<td>' + shiftAbbr('安康', day) + '</td>';
        day++;
      } else {
        nums += '<td></td>'; names += '<td></td>';
      }
    }
    h += '<tr>' + nums + '</tr><tr>' + names + '</tr>';
  }
  h += '</table><p style="font-size:11pt">';
  docsForWord().forEach(function (d) {
    h += '*' + d.name + (d.name === '鄒美勇' ? '部長' : '醫師') + ':公務機:82' + d.ext + ' ' + d.phone + '<br>';
  });
  h += '*麻醉醫師上班<br>(平日一至五):08:00至17:00值班至24:00<br>(週六): 8AM-16:00值班至24:00<br>(週日):值班 8AM-16:00<br>例假日值班: 8AM-24:00</p>';
  docBlob('安康值班表', h, ym.y + '年' + ('0' + ym.m).slice(-2) + '月份麻醉科主治醫師值班表-安康.doc');
}
</script>
