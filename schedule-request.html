<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>排班要班填報 | 耕莘醫院麻醉部</title>
<style>
  body { font-family: "Microsoft JhengHei", system-ui, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.2rem; color: #1a3c5e; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.06); padding: 18px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 1rem; color: #1a5e9e; margin: 0 0 12px; border-left: 4px solid #1a5e9e; padding-left: 8px; }
  select, input[type=password], input[type=month] { padding: 8px; border: 1px solid #bcd; border-radius: 6px; font-size: 1rem; }
  button { padding: 10px 18px; font-size: 1rem; border: 0; border-radius: 8px; background: #1a5e9e; color: #fff; cursor: pointer; }
  button:disabled { background: #9ab; }
  button.gray { background: #7a8a99; }
  .mbtn { padding: 4px 10px; min-width: 0; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .cat { padding: 6px 12px; border-radius: 16px; border: 2px solid transparent; cursor: pointer; font-size: .85rem; color: #fff; opacity: .55; }
  .cat.sel { opacity: 1; border-color: #333; font-weight: bold; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .h { text-align: center; font-size: .8rem; color: #789; padding: 4px 0; }
  .day { border: 1px solid #dde5ee; border-radius: 6px; min-height: 52px; padding: 3px 4px; cursor: pointer; font-size: .8rem; position: relative; background: #fff; user-select: none; }
  .day .n { font-weight: bold; color: #345; }
  .day .tag { display: block; margin-top: 2px; border-radius: 4px; color: #fff; text-align: center; font-size: .72rem; padding: 1px 0; }
  .day .oth { display: block; font-size: .62rem; color: #96a5b5; line-height: 1.25; margin-top: 1px; }
  .day.we { background: #f7fafd; }
  .day.blank { visibility: hidden; }
  textarea { width: 100%; box-sizing: border-box; border: 1px solid #bcd; border-radius: 6px; padding: 8px; font-size: .95rem; font-family: inherit; }
  #result { margin-top: 10px; white-space: pre-wrap; min-height: 1.2em; }
  .ok { color: #0a7a2f; font-weight: bold; }
  .err { color: #c0392b; font-weight: bold; }
  .hint { color: #789; font-size: .8rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>耕莘醫院麻醉部｜排班要班填報</h1>

  <div class="card" id="loginCard">
    <h2>身分確認</h2>
    <div class="row">
      <select id="docSel"><option>載入中…</option></select>
      <input type="password" id="pin" placeholder="個人碼" autocomplete="off" style="width:110px">
      <button type="button" class="gray mbtn" onclick="shiftMonth(-1)" title="上個月">◀</button>
      <input type="month" id="month">
      <button type="button" class="gray mbtn" onclick="shiftMonth(1)" title="下個月">▶</button>
      <button onclick="loadMine()">登入載入</button>
    </div>
    <div id="loginMsg" class="hint"></div>
  </div>

  <div id="editArea" style="display:none">
    <div class="card">
      <h2><span id="whoTitle"></span>：點選需求類別後，在月曆點日期（再點一次取消）</h2>
      <div class="cats" id="cats"></div>
      <div class="hint" id="st2hint" style="display:none;margin-bottom:8px">116 年 1 月起聖母分「白班」與「on call 夜班」：同一天兩個都點，就是要整天（白班＋夜班）。</div>
      <div class="cal" id="cal"></div>
      <div class="hint" style="margin-top:8px">同一天只能一種需求；改選其他類別再點該日期即可覆蓋。</div>
    </div>
    <div class="card">
      <h2>備註（自由填寫，其他特殊需求請寫在這裡）</h2>
      <textarea id="note" rows="2"></textarea>
    </div>
    <div class="card">
      <button id="submitBtn" onclick="submitReq()">送出需求</button>
      <div id="result"></div>
    </div>
  </div>
</div>

<script src="config.js?v=7"></script>
<script src="common.js?v=7"></script>
<script>
// 115/12 以前：休假／羅東聖母；116/01（2027/1）起聖母拆成「聖母白班」「聖母on call夜班」兩格
var CATS_OLD = [
  { key: '休假',     color: '#8e44ad' },
  { key: '羅東聖母', color: '#7f8c8d' }
];
var CATS_ST2 = [
  { key: '休假',     color: '#8e44ad' },
  { key: '聖母白班', color: '#95a5a6', label: '聖母白班' },
  { key: '聖母夜班', color: '#5d6d7e', label: '聖母on call夜班' }
];
var ST_DAY = '聖母白班', ST_NIGHT = '聖母夜班', ST_BOTH = '聖母全日';   // 同一天白班＋夜班 = 聖母全日
var CATS = CATS_OLD;
var curCat = 0, dayCat = {}, DIM = 0, CY = 0, CM = 0;
function isSt2Ym(y, m) { return y * 100 + m >= 202701; }
function monthYm() { var p = document.getElementById('month').value.split('-'); return [parseInt(p[0], 10), parseInt(p[1], 10)]; }
function renderCats() {
  var ym = monthYm();
  CATS = isSt2Ym(ym[0], ym[1]) ? CATS_ST2 : CATS_OLD;
  curCat = 0;
  document.getElementById('cats').innerHTML = CATS.map(function (c, i) {
    return '<span class="cat' + (i === 0 ? ' sel' : '') + '" style="background:' + c.color + '" onclick="pickCat(' + i + ')">' + (c.label || c.key) + '</span>';
  }).join('');
  var h = document.getElementById('st2hint');
  if (h) h.style.display = isSt2Ym(ym[0], ym[1]) ? 'block' : 'none';
}
var DOCS = [], OTHERS = {}; // OTHERS[day] = {off:[簡稱], st:[簡稱]}

init();

function init() {
  var sel = document.getElementById('docSel');
  function fillSel(list) {
    var cur = sel.value;
    sel.innerHTML = list.map(function (d) {
      return '<option value="' + d.name + '">' + d.name + '</option>';
    }).join('');
    if (cur) sel.value = cur;
  }
  // 名單先用本機快取即時顯示，背景再向後端要最新
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem('dpmDocList') || 'null'); } catch (e) {}
  if (cached && cached.length) fillSel(cached);
  if (cached && cached.length) DOCS = cached;
  jsonp({ action: 'doctorList' }, function (res) {
    if (res && res.ok) {
      DOCS = res.doctors;
      fillSel(res.doctors);
      try { localStorage.setItem('dpmDocList', JSON.stringify(res.doctors)); } catch (e) {}
    } else if (!cached) {
      sel.innerHTML = '<option>載入失敗</option>';
    }
  });
  var d = new Date();
  d.setDate(1); d.setMonth(d.getMonth() + 1); // 預設下個月
  document.getElementById('month').value = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  renderCats();
}

function pickCat(i) {
  curCat = i;
  document.querySelectorAll('.cat').forEach(function (el, j) { el.classList.toggle('sel', j === i); });
}


// 月份快捷鍵：◀ ▶ 切換上/下個月；已登入則自動重新載入該月
function shiftMonth(n) {
  var el = document.getElementById('month');
  var p = (el.value || '').split('-');
  var d = p.length === 2 ? new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1 + n, 1) : new Date();
  var v = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  if (document.getElementById('editArea').style.display === 'block') {
    if (!confirm('切換到 ' + v.replace('-', '/') + ' 會重新載入，尚未儲存／送出的變更將遺失，確定？')) return;
    el.value = v; loadMine();
  } else {
    el.value = v;
  }
}

function rocM() { return isoToRoc(document.getElementById('month').value); }

function loadMine() {
  var name = document.getElementById('docSel').value;
  var pin = document.getElementById('pin').value.trim();
  var msg = document.getElementById('loginMsg');
  if (!pin) { msg.innerHTML = '<span class="err">請輸入個人碼</span>'; return; }
  msg.textContent = '載入中…';
  jsonp({ action: 'myRequest', name: name, pin: pin, month: rocM() }, function (res) {
    if (!res || !res.ok) {
      msg.innerHTML = '<span class="err">' + ((res && res.error) || '載入失敗') + '</span>';
      return;
    }
    msg.innerHTML = '<span class="ok">身分確認成功</span>';
    document.getElementById('editArea').style.display = 'block';
    document.getElementById('whoTitle').textContent = name + '｜' + rocM() + ' 需求';
    renderCats();
    dayCat = {};
    document.getElementById('note').value = '';
    if (res.row) {
      CATS.forEach(function (c) {
        var i = res.headers.indexOf(c.key);
        if (i < 0) return;
        var v = String(res.row[i] || '');
        v.split(',').forEach(function (s) {
          var n = parseInt(s, 10);
          if (!(n >= 1 && n <= 31)) return;
          if ((c.key === ST_DAY && dayCat[n] === ST_NIGHT) || (c.key === ST_NIGHT && dayCat[n] === ST_DAY)) dayCat[n] = ST_BOTH;
          else dayCat[n] = c.key;
        });
      });
      document.getElementById('note').value = res.row[res.headers.indexOf('備註')] || '';
    }
    buildCal();
    loadOthers(name, pin);
  });
}

function abbrOf(name) {
  var d = DOCS.filter(function (x) { return x.name === name; })[0];
  return d ? d.abbr : name.slice(-1);
}

// 同月其他醫師的已要休/聖母（灰色小字）
function loadOthers(name, pin) {
  OTHERS = {};
  jsonp({ action: 'requestAll', name: name, pin: pin, month: rocM() }, function (res) {
    if (!res || !res.ok) return;
    res.rows.forEach(function (r) {
      if (r.name === name) return; // 排除自己
      var ab = abbrOf(r.name);
      String(r.off).split(/[,，]/).forEach(function (s) {
        var n = parseInt(s, 10);
        if (n >= 1 && n <= 31) { (OTHERS[n] = OTHERS[n] || { off: [], st: [] }).off.push(ab); }
      });
      String(r.st).split(/[,，]/).forEach(function (s) {
        var n = parseInt(s, 10);
        if (n >= 1 && n <= 31) { (OTHERS[n] = OTHERS[n] || { off: [], st: [] }).st.push(ab); }
      });
      [['sd', 'sd'], ['sn', 'sn']].forEach(function (k) {
        String(r[k[0]] || '').split(/[,，]/).forEach(function (s) {
          var n = parseInt(s, 10);
          if (n >= 1 && n <= 31) { var o = (OTHERS[n] = OTHERS[n] || { off: [], st: [] }); (o[k[1]] = o[k[1]] || []).push(ab); }
        });
      });
    });
    paintOthers();
  });
}

function paintOthers() {
  for (var d = 1; d <= DIM; d++) {
    var el = document.getElementById('oth' + d);
    if (!el) continue;
    var o = OTHERS[d];
    var txt = '';
    if (o) {
      if (o.off.length) txt += '休:' + o.off.join('');
      if (o.st.length) txt += (txt ? ' ' : '') + '聖:' + o.st.join('');
      if (o.sd && o.sd.length) txt += (txt ? ' ' : '') + '聖白:' + o.sd.join('');
      if (o.sn && o.sn.length) txt += (txt ? ' ' : '') + '聖夜:' + o.sn.join('');
    }
    el.textContent = txt;
  }
}

function buildCal() {
  var iso = document.getElementById('month').value.split('-');
  var y = parseInt(iso[0], 10), m = parseInt(iso[1], 10);
  CY = y; CM = m;
  DIM = new Date(y, m, 0).getDate();
  var first = new Date(y, m - 1, 1).getDay(); // 0=日
  var html = ['日', '一', '二', '三', '四', '五', '六'].map(function (w) { return '<div class="h">' + w + '</div>'; }).join('');
  for (var b = 0; b < first; b++) html += '<div class="day blank"></div>';
  for (var d = 1; d <= DIM; d++) {
    var dow = new Date(y, m - 1, d).getDay();
    html += '<div class="day' + (dow === 0 || dow === 6 ? ' we' : '') + '" id="day' + d + '" onclick="tapDay(' + d + ')"><span class="n">' + d + '</span><span class="tag" id="tag' + d + '"></span><span class="oth" id="oth' + d + '"></span></div>';
  }
  document.getElementById('cal').innerHTML = html;
  for (var i = 1; i <= DIM; i++) paintDay(i);
}

function tapDay(d) {
  var k = CATS[curCat].key;
  // 115/12 以前聖母只有週一、二；116/01（2027/1）起擴大支援、排班規則未定 → 不限星期
  if (k === '羅東聖母' && dayCat[d] !== k && CY * 100 + CM < 202701) {
    var w = new Date(CY, CM - 1, d).getDay();
    if (w !== 1 && w !== 2) { alert('羅東聖母只有星期一、星期二，請選週一或週二的日期'); return; }
  }
  var cur = dayCat[d];
  if (k === ST_DAY || k === ST_NIGHT) {
    var other = (k === ST_DAY) ? ST_NIGHT : ST_DAY;
    if (cur === ST_BOTH) dayCat[d] = other;          // 全日 → 拿掉這一半
    else if (cur === other) dayCat[d] = ST_BOTH;     // 已有另一半 → 合併為全日
    else if (cur === k) delete dayCat[d];
    else dayCat[d] = k;
  } else if (cur === k) delete dayCat[d];
  else dayCat[d] = k;
  paintDay(d);
}

function paintDay(d) {
  var tag = document.getElementById('tag' + d);
  if (!tag) return;
  var k = dayCat[d];
  if (!k) { tag.textContent = ''; tag.style.background = ''; return; }
  if (k === ST_BOTH) { tag.textContent = '聖全日'; tag.style.background = '#34495e'; return; }
  var c = CATS.filter(function (x) { return x.key === k; })[0];
  var SHORT = { '休假': '休', '聖母白班': '聖白', '聖母夜班': '聖夜' };
  tag.textContent = SHORT[k] || k;
  tag.style.background = c ? c.color : '#999';
}

function submitReq() {
  var name = document.getElementById('docSel').value;
  var pin = document.getElementById('pin').value.trim();
  var data = { '備註': document.getElementById('note').value.trim() };
  CATS.forEach(function (c) {
    var days = [];
    for (var d = 1; d <= DIM; d++) {
      if (dayCat[d] === c.key || (dayCat[d] === ST_BOTH && (c.key === ST_DAY || c.key === ST_NIGHT))) days.push(d);
    }
    data[c.key] = days.join(',');
  });
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  showResult('送出中…', null);
  fetch(API_URL, { method: 'POST', mode: 'no-cors',
    body: new URLSearchParams({ action: 'saveRequest', name: name, pin: pin, month: rocM(), data: JSON.stringify(data) }) });
  setTimeout(function () {
    jsonp({ action: 'myRequest', name: name, pin: pin, month: rocM() }, function (res) {
      btn.disabled = false;
      if (res && res.ok && res.row && String(res.row[res.headers.indexOf('休假')] || '') === data['休假']) {
        showResult('✓ ' + rocM() + ' 需求已送出，排班時會納入考量', true);
      } else {
        showResult('回讀驗證未通過，請再送出一次', false);
      }
    });
  }, 3000);
}

function showResult(msg, ok) {
  var el = document.getElementById('result');
  el.innerHTML = ok === null ? msg : '<span class="' + (ok ? 'ok' : 'err') + '">' + msg + '</span>';
}
</script>
</body>
</html>
